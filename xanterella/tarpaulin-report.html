edmi_device.name, \"Redmi Note 13 Pro\");\n        assert_eq!(redmi_device.os, \"android\");\n        assert_eq!(redmi_device.ip[0], \"100.124.213.38\");\n    }\n    #[test]\n    fn test_get_drives_size() {\n        let size = \"1M\";\n        assert_eq!(get_drives_size(\u0026size), 1048576);\n    }\n    #[test]\n    fn test_serde_json_convert_lsblk() {\n        let mock_json = r#\"{\n            \"blockdevices\": [\n                {\n                    \"name\": \"nvme0n1\",\n                    \"size\": \"1T\",\n                    \"type\": \"disk\"\n                },\n                {\n                    \"name\": \"sda\",\n                    \"size\": \"500G\",\n                    \"type\": \"disk\"\n                },\n                {\n                    \"name\": \"sda1\",\n                    \"size\": \"500G\",\n                    \"type\": \"part\"\n                }\n            ]\n        }\"#;\n        let parsed: Drives = serde_json::from_str(mock_json).expect(\"Konnte das JSON nicht formatieren\");\n        assert_eq!(parsed.blockdevices.len(), 3);\n        assert_eq!(parsed.blockdevices[0].name, \"nvme0n1\");\n        assert_eq!(parsed.blockdevices[0].size, \"1T\");\n        assert_eq!(parsed.blockdevices[0].device_type, \"disk\");\n        assert_eq!(parsed.blockdevices[2].name, \"sda1\");\n        assert_eq!(parsed.blockdevices[2].device_type, \"part\");\n    }\n    #[test]\n    fn test_get_sort_drives() {\n        let mock_json = r#\"{\n            \"blockdevices\": [\n                {\n                    \"name\": \"nvme0n1\",\n                    \"size\": \"1T\",\n                    \"type\": \"disk\"\n                },\n                {\n                    \"name\": \"sda\",\n                    \"size\": \"500G\",\n                    \"type\": \"disk\"\n                },\n                {\n                    \"name\": \"sdb1\",\n                    \"size\": \"800G\",\n                    \"type\": \"part\"\n                },\n                {\n                    \"name\": \"sdc1\",\n                    \"size\": \"600G\",\n                    \"type\": \"part\"\n                },\n                {\n                    \"name\": \"sdd1\",\n                    \"size\": \"400G\",\n                    \"type\": \"part\"\n                }\n            ]\n        }\"#;\n        let parsed: Drives = serde_json::from_str(mock_json).expect(\"Konnte das JSON nicht formatieren\");\n        let sorted: Drives = get_sort_drives(parsed);\n        assert_eq!(sorted.blockdevices.len(), 5);\n        assert_eq!(sorted.blockdevices[0].name, \"nvme0n1\");\n        assert_eq!(sorted.blockdevices[0].size, \"1T\");\n        assert_eq!(sorted.blockdevices[0].device_type, \"disk\");\n        assert_eq!(sorted.blockdevices[1].name, \"sdb1\");\n        assert_eq!(sorted.blockdevices[1].device_type, \"part\");\n        assert_eq!(sorted.blockdevices[4].name, \"sdd1\");\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","cato","xanterella","cli","xanterella","src","utils","git.rs"],"content":"use log::{debug, error, info};\n\nuse std::process::{self, Command};\n\nuse crate::utils::get::*;\n\npub enum Branches {\n    Xanterella,\n    Main,\n}\n\npub fn git_full(cm_msg: String) {\n    info!(\"[ RUN ] - Starte Git Prozedur\");\n\n    let diff =\n        Command::new(\"git\").args([\"diff\", \"--stat\"]).current_dir(get_path(Paths::Nixconf)).output().unwrap_or_else(\n            |err| {\n                error!(\"[ FAILED ] - Konnte Git nicht starten: {}\", err);\n                process::exit(1);\n            },\n        );\n    if !diff.status.success() {\n        error!(\"[ FAILED ] - Git diff hat nicht funktioniert: {}\", String::from_utf8_lossy(\u0026diff.stderr));\n        process::exit(1);\n    }\n\n    debug!(\"{}\", String::from_utf8_lossy(\u0026diff.stdout));\n\n    let add =\n        Command::new(\"git\").args([\"add\", \"-A\"]).current_dir(get_path(Paths::Nixconf)).output().unwrap_or_else(|err| {\n            error!(\"[ FAILED ] - Konnte Git nicht starten: {}\", err);\n            process::exit(1);\n        });\n    if !add.status.success() {\n        error!(\"[ FAILED ] - Git add hat nicht funktioniert: {}\", String::from_utf8_lossy(\u0026add.stderr));\n        process::exit(1);\n    }\n\n    info!(\"[ OK ] - Dateien wurden Git hinzuigefügt\");\n\n    let commit = Command::new(\"git\")\n        .args([\"commit\", \"-am\", \u0026cm_msg])\n        .current_dir(get_path(Paths::Nixconf))\n        .output()\n        .unwrap_or_else(|err| {\n            error!(\"[ FAILED ] - Konnte Git nicht starten: {}\", err);\n            process::exit(1);\n        });\n    if !commit.status.success() {\n        error!(\"[ FAILED ] - Git commit hat nicht funktioniert: {}\", String::from_utf8_lossy(\u0026commit.stderr));\n        process::exit(1);\n    }\n\n    info!(\"[ OK ] - Änderungen Commited\");\n}\n\npub fn git_checkout(branch: Branches) {\n    match branch {\n        Branches::Xanterella =\u003e {\n            let checkout = Command::new(\"git\")\n                .arg(\"checkout\")\n                .arg(\"xanterella\")\n                .current_dir(get_path(Paths::Nixconf))\n                .output()\n                .unwrap_or_else(|err| {\n                    error!(\"[ FAILED ] - Konnte Git nicht starten: {}\", err);\n                    process::exit(1);\n                });\n            if !checkout.status.success() {\n                error!(\"[ FAILED ] - Konnte die Branch nicht wechseln\");\n                info!(\"[ OK ] - Branch wird erstellt\");\n\n                let create = Command::new(\"git\")\n                    .args([\"checkout\", \"-b\", \"xanterella\"])\n                    .current_dir(get_path(Paths::Nixconf))\n                    .output()\n                    .unwrap_or_else(|err| {\n                        error!(\"[ FAILED ] - Konnte Git nicht starten: {}\", err);\n                        process::exit(1);\n                    });\n                if !create.status.success() {\n                    error!(\n                        \"[ FAILED ] - Fehler beim erstellen der Branch: Xanterella: {}\",\n                        String::from_utf8_lossy(\u0026create.stderr)\n                    );\n                    process::exit(1);\n                }\n\n                info!(\"[ OK ] - Branch xanterella erstellt und gewechselt\");\n            }\n        }\n        Branches::Main =\u003e {\n            let checkout = Command::new(\"git\")\n                .arg(\"checkout\")\n                .arg(\"main\")\n                .current_dir(get_path(Paths::Nixconf))\n                .output()\n                .unwrap_or_else(|err| {\n                    error!(\"[ FAILED ] - Konnte Git nicht starten: {}\", err);\n                    process::exit(1);\n                });\n            if !checkout.status.success() {\n                error!(\"[ FAILED ] - Konnte die Branch nicht wechseln\");\n                info!(\"[ OK ] - Branch wird erstellt\");\n\n                let create = Command::new(\"git\")\n                    .args([\"checkout\", \"-b\", \"main\"])\n                    .current_dir(get_path(Paths::Nixconf))\n                    .output()\n                    .unwrap_or_else(|err| {\n                        error!(\"[ FAILED ] - Konnte Git nicht starten: {}\", err);\n                        process::exit(1);\n                    });\n                if !create.status.success() {\n                    error!(\n                        \"[ FAILED ] - Fehler beim erstellen der Branch: Main: {}\",\n                        String::from_utf8_lossy(\u0026create.stderr)\n                    );\n                    process::exit(1);\n                }\n\n                info!(\"[ OK ] - Branch main erstellt und gewechselt\");\n            }\n        }\n    }\n}\n\npub fn git_auto_pr(added_host: String) {\n    let title_message = format!(\"Xanterella: Added Host: {}\", added_host);\n    let bod     <script>const e = React.createElement;

function pathToString(path) {
  if (path[0] === '/') {
    return '/' + path.slice(1).join('/');
  } else {
    return path.join('/');
  }
}

function findCommonPath(files) {
  if (!files || !files.length) {
    return [];
  }

  function isPrefix(arr, prefix) {
    if (arr.length < prefix.length) {
      return false;
    }
    for (let i = prefix.length - 1; i >= 0; --i) {
      if (arr[i] !== prefix[i]) {
        return false;
      }
    }
    return true;
  }

  let commonPath = files[0].path.slice(0, -1);
  while (commonPath.length) {
    if (files.every(file => isPrefix(file.path, commonPath))) {
      break;
    }
    commonPath.pop();
  }
  return commonPath;
}

function findFolders(files) {
  if (!files || !files.length) {
    return [];
  }

  let folders = files.filter(file => file.path.length > 1).map(file => file.path[0]);
  folders = [...new Set(folders)]; // unique
  folders.sort();

  folders = folders.map(folder => {
    let filesInFolder = files
      .filter(file => file.path[0] === folder)
      .map(file => ({
        ...file,
        path: file.path.slice(1),
        parent: [...file.parent, file.path[0]],
      }));

    const children = findFolders(filesInFolder); // recursion

    return {
      is_folder: true,
      path: [folder],
      parent: files[0].parent,
      children,
      covered: children.reduce((sum, file) => sum + file.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.coverable, 0),
      prevRun: {
        covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
        coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
      },
    };
  });

  return [...folders, ...files.filter(file => file.path.length === 1)];
}

class App extends React.Component {
  constructor(...args) {
    super(...args);

    this.state = {
      current: [],
    };
  }

  componentDidMount() {
    this.updateStateFromLocation();
    window.addEventListener('hashchange', () => this.updateStateFromLocation(), false);
  }

  updateStateFromLocation() {
    if (window.location.hash.length > 1) {
      const current = window.location.hash.slice(1).split('/');
      this.setState({current});
    } else {
      this.setState({current: []});
    }
  }

  getCurrentPath() {
    let file = this.props.root;
    let path = [file];
    for (let p of this.state.current) {
      file = file.children.find(file => file.path[0] === p);
      if (!file) {
        return path;
      }
      path.push(file);
    }
    return path;
  }

  render() {
    const path = this.getCurrentPath();
    const file = path[path.length - 1];

    let w = null;
    if (file.is_folder) {
      w = e(FilesList, {
        folder: file,
        onSelectFile: this.selectFile.bind(this),
        onBack: path.length > 1 ? this.back.bind(this) : null,
      });
    } else {
      w = e(DisplayFile, {
        file,
        onBack: this.back.bind(this),
      });
    }

    return e('div', {className: 'app'}, w);
  }

  selectFile(file) {
    this.setState(
      ({current}) => {
        return {current: [...current, file.path[0]]};
      },
      () => this.updateHash(),
    );
  }

  back(file) {
    this.setState(
      ({current}) => {
        return {current: current.slice(0, current.length - 1)};
      },
      () => this.updateHash(),
    );
  }

  updateHash() {
    if (!this.state.current || !this.state.current.length) {
      window.location = '#';
    } else {
      window.location = '#' + this.state.current.join('/');
    }
  }
}

function FilesList({folder, onSelectFile, onBack}) {
  let files = folder.children;
  return e(
    'div',
    {className: 'display-folder'},
    e(FileHeader, {file: folder, onBack}),
    e(
      'table',
      {className: 'files-list'},
      e('thead', {className: 'files-list__head'}, e('tr', null, e('th', null, 'Path'), e('th', null, 'Coverage'))),
      e(
        'tbody',
        {className: 'files-list__body'},
        files.map(file => e(File, {file, onClick: onSelectFile})),
      ),
    ),
  );
}

function File({file, onClick}) {
  const coverage = file.coverable ? (file.covered / file.coverable) * 100 : -1;
  const coverageDelta =
    file.prevRun && (file.covered / file.coverable) * 100 - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'tr',
    {
      className:
        'files-list__file' +
        (coverage >= 0 && coverage < 50 ? ' files-list__file_low' : '') +
        (coverage >= 50 && coverage < 80 ? ' files-list__file_medium' : '') +
        (coverage >= 80 ? ' files-list__file_high' : '') +
        (file.is_folder ? ' files-list__file_folder' : ''),
      onClick: () => onClick(file),
    },
    e('td', null, e('a', null, pathToString(file.path))),
    e(
      'td',
      null,
      file.covered + ' / ' + file.coverable + (coverage >= 0 ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
    ),
  );
}

function DisplayFile({file, onBack}) {
  return e('div', {className: 'display-file'}, e(FileHeader, {file, onBack}), e(FileContent, {file}));
}

function FileHeader({file, onBack}) {
  const coverage = (file.covered / file.coverable) * 100;
  const coverageDelta = file.prevRun && coverage - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'div',
    {className: 'file-header'},
    onBack ? e('a', {className: 'file-header__back', onClick: onBack}, 'Back') : null,
    e('div', {className: 'file-header__name'}, pathToString([...file.parent, ...file.path])),
    e(
      'div',
      {className: 'file-header__stat'},
      'Covered: ' + file.covered + ' of ' + file.coverable + (file.coverable ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
      e('input', {id: 'theme-toggle', type: 'checkbox', hidden: true}),
      e('label', {for: 'theme-toggle', id: 'theme-toggle-label'}, '🌙'),
    ),
  );
}

function FileContent({file}) {
  return e(
    'pre',
    {className: 'file-content'},
    file.content.split(/\r?\n/).map((line, index) => {
      const trace = file.traces.find(trace => trace.line === index + 1);
      const covered = trace && trace.stats.Line;
      const uncovered = trace && !trace.stats.Line;
      const nbHit = covered? trace.stats.Line: 0;
      return e(
        'div',
        { className: 'code-text-container' },
        e(
          'code',
          {
            className: 'code-line' + (covered ? ' code-line_covered' : '') + (uncovered ? ' code-line_uncovered' : ''),
          },
          line
        ),
        e(
          'div',
          { className: 'cover-indicator' + (covered? ' check-cover': '') + (uncovered? ' no-cover': '')},
          e(
            'div',
            { className: (covered? 'stat-line-hit': '')},
            covered? nbHit: ""
          )
        )
      );
    }),
  );
}

(function () {
  const commonPath = findCommonPath(data.files);
  const prevFilesMap = new Map();

  previousData &&
    previousData.files.forEach(file => {
      const path = file.path.slice(commonPath.length).join('/');
      prevFilesMap.set(path, file);
    });

  const files = data.files.map(file => {
    const path = file.path.slice(commonPath.length);
    const {covered = 0, coverable = 0} = prevFilesMap.get(path.join('/')) || {};
    return {
      ...file,
      path,
      parent: commonPath,
      prevRun: {covered, coverable},
    };
  });

  const children = findFolders(files);

  const root = {
    is_folder: true,
    children,
    path: commonPath,
    parent: [],
    covered: children.reduce((sum, file) => sum + file.covered, 0),
    coverable: children.reduce((sum, file) => sum + file.coverable, 0),
    prevRun: {
      covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
    },
  };

  ReactDOM.render(e(App, {root, prevFilesMap}), document.getElementById('root'));

  const toggle = document.getElementById('theme-toggle');
  const label = document.getElementById('theme-toggle-label');
  label.textContent = '🌙';

  toggle.addEventListener('change', () => {
    if (toggle.checked) {
      document.documentElement.setAttribute('data-theme', 'dark');
      label.textContent = '☀️';
    } else {
      document.documentElement.removeAttribute('data-theme');
      label.textContent = '🌙';
    }
  });
})();
</script>
