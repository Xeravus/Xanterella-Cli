<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 72px;
}
.code-line {
  margin: 0;
  height: 1em;
  counter-increment: line;

  position: absolute;
  padding: 0 0.3em 0.3em 0.3em;
  display: inherit;
  width: 100%;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

.code-text-container {
  position: relative;
  height: 1em;
  padding: 0.3em 0;
}

.cover-indicator {
  display: flex;
  width: 100%;
  position: absolute;
  justify-content: end;
  height: 1em;
  align-items: center;
  padding: 0 0.3em 0.3em 0.3em;
}

.cover-indicator.check-cover::after {
  content: "\2713";
  font-weight: bold;
  background-color: var(--green);
  height: 1em;
}

.cover-indicator.no-cover::after {
  content: "\2716";
  font-weight: bold;
  background-color: var(--red);
  height: 1em;
}

.stat-line-hit {
  max-width: 48px;
  overflow: hidden;
  font-weight: bold;
  margin-right: 4px;
  background-color: var(--green);
  position: relative;
  top: 0.1em;
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

;\n        assert!(result.contains(\"buildOnTarget = false;\"));\n        assert!(result.contains(\"keys = commonSSHKeys;\"));\n        assert!(result.contains(\"imports = [\"));\n        assert!(!result.contains(\"targetHost = null\"));\n        assert!(result.contains(\"];\"));\n        assert!(result.contains(\"};\"));\n    }\n\n    #[test]\n    fn test_colmena_sort() {\n        let mut file = ColmenaManager::init(\"/dummy/path\");\n        file.hosts = vec![\n            create_dummy_host(\"zeta\"),\n            create_dummy_host(\"alpha\"),\n            create_dummy_host(\"omega\"),\n            create_dummy_host(\"beta\"),\n        ];\n        \n        file.sort_hosts(); \n        \n        assert_eq!(file.hosts.len(), 4);\n        assert_eq!(file.hosts[0].name, \"alpha\");\n        assert_eq!(file.hosts[1].name, \"beta\");\n        assert_eq!(file.hosts[2].name, \"omega\");\n        assert_eq!(file.hosts[3].name, \"zeta\");\n    }\n\n    #[test]\n    fn test_colmena_sort_already() {\n        let mut file = ColmenaManager::init(\"/dummy/path\");\n        file.hosts = vec![create_dummy_host(\"crylia\"), create_dummy_host(\"todesstern\")];\n        \n        file.sort_hosts();\n        \n        assert_eq!(file.hosts[0].name, \"crylia\");\n        assert_eq!(file.hosts[1].name, \"todesstern\");\n    }\n\n    #[test]\n    fn test_colmena_sort_case_sens() {\n        let mut file = ColmenaManager::init(\"/dummy/path\");\n        file.hosts = vec![create_dummy_host(\"Zeta\"), create_dummy_host(\"alpha\")];\n        file.sort_hosts();\n        assert_eq!(file.hosts[0].name, \"Zeta\"); \n        assert_eq!(file.hosts[1].name, \"alpha\");\n    }\n\n    #[test]\n    fn test_colmena_gen_finished_string() {\n        let mut file = ColmenaManager::init(\"/dummy/path\");\n        file.hosts = vec![create_dummy_host(\"alpha_node\"), create_dummy_host(\"beta_node\")];\n        \n        let result = file.gen_finished_string();\n        \n        assert!(result.contains(\"alpha_node = {\"));\n        assert!(result.contains(\"beta_node = {\"));\n        assert!(result.contains('\\n'));\n    }\n\n    #[test]\n    fn test_colmena_replace_content() {\n        let mut file = ColmenaManager::init(\"/dummy/path\");\n        file.content = \"Dies ist ein Test.\\n# --- Xanterella Hosts Start ---\\nAlter Inhalt\\n# --- Xanterella Hosts End ---\\nEnde.\".to_string();\n        file.hosts = vec![create_dummy_host(\"new_node\")];\n        \n        let result = file.content_replace();\n        \n        assert!(result.contains(\"Dies ist ein Test.\"));\n        assert!(result.contains(\"new_node = {\"));\n        assert!(!result.contains(\"Alter Inhalt\")); \n        assert!(result.contains(\"Ende.\"));\n    }\n    const MOCK_COLMENA_FILE: \u0026str = r#\"\n  };\n  # --- Xanterella Hosts Start ---\n  xeravus = {\n    deployment = {\n      targetHost = null;\n      allowLocalDeployment = true;\n      buildOnTarget = true;\n    };\n    imports = [\n      ./hosts/xeravus/configuration.nix\n      ./profiles/ssh-keys.nix\n    ];\n  };\n  vicuna = {\n    deployment = {\n      targetHost = \"192.168.178.30\";\n      targetUser = taruser;\n      buildOnTarget = false;\n      keys = commonSSHKeys;\n    };\n    imports = [\n      ./hosts/vicuna/configuration.nix\n      ./profiles/ssh-keys.nix\n      inputs.nixos-hardware.nixosModules.raspberry-pi-5\n    ];\n  };\n  # --- Xanterella Hosts End ---\n}\n\"#;\n\n    const MOCK_VICUNA_BLOCK: \u0026str = r#\"  vicuna = {\n    deployment = {\n      targetHost = \"192.168.178.30\";\n      targetUser = taruser;\n      buildOnTarget = false;\n      keys = commonSSHKeys;\n    };\n    imports = [\n      ./hosts/vicuna/configuration.nix\n      ./profiles/ssh-keys.nix\n      inputs.nixos-hardware.nixosModules.raspberry-pi-5\n    ];\n  };\"#;\n\n    const MOCK_XERAVUS_BLOCK: \u0026str = r#\"  xeravus = {\n    deployment = {\n      targetHost = null;\n      allowLocalDeployment = true;\n      buildOnTarget = true;\n    };\n    imports = [\n      ./hosts/xeravus/configuration.nix\n    ];\n  };\"#;\n\n    #[test]\n    fn test_colmena_add_host_from_content1() {\n        let host = ColmenaHost::new_from_content(MOCK_VICUNA_BLOCK);\n        \n        assert_eq!(host.name, \"vicuna\");\n        assert_eq!(host.ip, \"192.168.178.30\");\n        assert_eq!(host.builder, false);\n        assert_eq!(host.imports.len(), 3);\n        assert_eq!(host.imports[0], \"./hosts/vicuna/configuration.nix\");\n        assert_eq!(host.imports[2], \"inputs.nixos-hardware.nixosModules.raspberry-pi-5\");\n    }\n\n    #[test]\n    fn test_colmena_add_host_from_content2() {\n        let host = ColmenaHost::new_from_content(MOCK_XERAVUS_BLOCK);\n        \n        assert_eq!(host.name, \"xeravus\");\n        assert_eq!(host.ip, \"null\"); \n        assert_eq!(host.builder, true);\n    }\n\n    #[test]\n    fn test_colmena_file_parse_hosts() {\n        let mut file = ColmenaManager::init(\"/dummy/path\");\n        file.content = MOCK_COLMENA_FILE.to_string();\n        \n        file.parse_hosts();\n        for i in \u0026file.hosts {\n            println!(\"{:#?}\", i);\n        }\n        \n        assert_eq!(file.hosts.len(), 2);\n        \n        assert_eq!(file.hosts[0].name, \"xeravus\");\n        assert_eq!(file.hosts[0].builder, true);\n        \n        assert_eq!(file.hosts[1].name, \"vicuna\");\n        assert_eq!(file.hosts[1].ip, \"192.168.178.30\");\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","cato","xanterella","cli","xanterella","src","config","core.rs"],"content":"use log::{info, debug};\n\nuse crate::utils::core::*;\nuse crate::config::query::*;\nuse crate::config::filepaths::*;\nuse crate::config::colmena::*;\n\nuse crate::config::xanterella::host::*;\n\npub fn list_hosts() {\n    info!(\"Hosts: \");\n    for i in query_hosts() {\n        info!(\"{}\", convert_filepath(\u0026i, OutPath::Last, false));\n    }\n}\n\npub fn host_add(injection_path: \u0026str, name: \u0026str, ip: \u0026str, remotebuilder: bool, sysversion: Option\u003cf32\u003e, hardware_string: Option\u003cString\u003e) {\n    colmena_add(\u0026convert_path(injection_path, Target::Colmena), name, ip, remotebuilder);\n    xanterella_add_host(\u0026convert_path(injection_path, Target::Hosts), name, sysversion, hardware_string);\n}\n\npub fn host_remove(injection_path: \u0026str, name: \u0026str, ip: Option\u003c\u0026str\u003e) {\n    colmena_remove(\u0026convert_path(injection_path, Target::Colmena), Some(name), ip);\n    xanterella_remove_host(\u0026convert_path(injection_path, Target::Hosts), name);\n}\n\npub fn sort_host(injection_path: \u0026str) {\n    colmena_rewrite(\u0026convert_path(injection_path, Target::Colmena));\n    xanterella_sort_hosts(\u0026convert_path(injection_path, Target::Hosts));\n}\n\npub fn colmena_add(injection_path: \u0026str, name: \u0026str, ip: \u0026str, remotebuilder: bool) {\n    info!(\"[ RUN ] - Füge Host: {} hinzu zu Colmena\", name);\n\n    let mut colmena = ColmenaManager::init(injection_path);\n    colmena.load();\n    colmena.add_host(name, ip, remotebuilder);\n    colmena.sort_hosts();\n    colmena.write();\n    files_alejandra(injection_path);\n    info!(\"[ OK ] - Host: {} erfolgreich zu Colmena hinzugefügt\", name);\n}\n\npub fn colmena_remove(injection_path: \u0026str, name: Option\u003c\u0026str\u003e, ip: Option\u003c\u0026str\u003e) {\n    info!(\"[ RUN ] - Lösche Host aus Colmena\");\n    \n    let mut colmena = ColmenaManager::init(injection_path);\n    colmena.load();\n    colmena.remove_host(name, ip);\n    colmena.sort_hosts();\n    colmena.write();\n    files_alejandra(injection_path);\n    info!(\"[ OK ] - Host erfolgreich gelöscht aus Colmena\");\n}\n\npub fn colmena_rewrite(injection_path: \u0026str) {\n    info!(\"[ RUN ] - Starte Reload der Colmena Hosts\");\n\n    let mut colmena = ColmenaManager::init(injection_path);\n    colmena.load();\n    colmena.sort_hosts();\n    colmena.write();\n    files_alejandr ub injection_path: String,\n}\n\nimpl XanterellaHostManager {\n    pub fn init(injection_path: \u0026str) -\u003e Self {\n        Self {\n            hosts: vec![],\n            injection_path: injection_path.to_string(),\n        }\n    }\n\n    pub fn load(\u0026mut self) {\n        let hosts = self.list_hosts();\n        self.alejandra();\n        for i in hosts {\n            let path = PathBuf::from(\u0026self.injection_path).join(i).join(\"configuration\");\n            let content = fs::read_to_string(path).unwrap();\n            self.hosts.push(XanterellaHost::new_from_content(\u0026self.injection_path, \u0026content))\n        }\n    }\n\n    pub fn alejandra(\u0026self) {\n        let alejandra = Command::new(\"alejandra\")\n            .arg(\u0026self.injection_path)\n            .output()\n            .unwrap_or_else(|err| {\n                error!(\"[ FAILED ] - Konnte Alejandra nicht starten: {}\", err);\n                //process::exit(1);\n                panic!(\"Alejandra 1\");\n            });\n        if !alejandra.status.success() {\n            error!(\n                \"[ FAILED ] - Konnte die Dateien mit Alejandra nicht formatieren: {}\",\n                String::from_utf8_lossy(\u0026alejandra.stderr)\n            );\n            //process::exit(1);\n            panic!(\"Alejandra 2\");\n        }\n        info!(\"[ OK ] - Alejandra erfolgreich\");\n    }\n\n    pub fn list_hosts(\u0026self) -\u003e Vec\u003cString\u003e {\n        WalkDir::new(\u0026self.injection_path)\n            .min_depth(1)\n            .sort_by_file_name()\n            .into_iter()\n            .filter_map(|entry| entry.ok())\n            .filter(|entry| entry.file_type().is_dir())\n            .filter_map(|entry| {\n                entry.path().to_str().map(|s| s.to_string())\n            })\n            .collect()\n    }\n\n    pub fn check_for_host(\u0026self, name: \u0026str) -\u003e bool {\n        self.hosts.iter().any(|h| h.name == name)\n    }\n\n    pub fn add_host(\u0026mut self, name: \u0026str, sysversion: Option\u003cf32\u003e, hardware_string: Option\u003cString\u003e,) {\n        let sys_version = match sysversion {\n            Some(version) =\u003e version,\n            None =\u003e 25.05,\n        };\n        if !self.check_for_host(name) {\n            self.hosts.push(XanterellaHost::new(\u0026self.injection_path, name, sys_version, vec![], hardware_string, None))\n        } else {\n            error!(\"[ FAILED ] - Host existiert schon\");\n        }\n    }\n\n    pub fn remove_host(\u0026mut self, name: \u0026str) {\n        self.hosts.retain(|host| {\n            host.name != name\n        });\n    }\n\n    pub fn write(\u0026self) {\n        for i in \u0026self.hosts {\n            i.create_dir();\n            i.create_file();\n        }\n    }\n\n    pub fn clean(\u0026self) {\n        for i in \u0026self.hosts {\n            i.remove_dir()\n        }\n    }\n}\n\nimpl XanterellaHost {\n    pub fn new(injection_path: \u0026str, name: \u0026str, sysversion: f32, input_imports: Vec\u003cString\u003e, hardware_string: Option\u003cString\u003e, extra_attributes: Option\u003cVec\u003cString\u003e\u003e) -\u003e Self {\n        let imports = Self::gen_imports(input_imports);\n        let hardware = match hardware_string {\n            Some(string) =\u003e string,\n            None =\u003e String::new(),\n        };\n        let extra: Vec\u003cString\u003e = match extra_attributes {\n            Some(string) =\u003e string,\n            None =\u003e vec![],\n        };\n        let finished_string = Self::gen_finished_string(name, sysversion, \u0026imports, \u0026extra);\n        Self {\n            name: name.to_string(),\n            sysversion,\n            imports,\n            finished_string,\n            hardware_string: hardware,\n            extra_attributes: extra,\n            injection_path: injection_path.to_string(),\n        }\n    }\n\n    pub fn new_from_content(injection_path: \u0026str, content: \u0026str) -\u003e Self {\n        let name = Self::extract_name(content);\n        let sysversion = Self::extract_sysversion(content);\n        let imports = Self::extract_imports(content);\n        let hardware = Self::extract_hardware(injection_path, \u0026name);\n        let extra_attributes = Self::extract_extra_attributes(content, \u0026imports);\n        let finished_string = Self::gen_finished_string(\u0026name, sysversion, \u0026imports, \u0026extra_attributes);\n        Self {\n            name,\n            sysversion,\n            imports,\n            finished_string,\n            hardware_string: hardware,\n            extra_attributes,\n            injection_path: injection_path.to_string(),\n        }\n    }\n\n    pub fn create_dir(\u0026self) {\n        let path = PathBuf::from(\u0026self.injection_path).join(\u0026self.name);\n        fs::create_dir_all(path)\n            .unwrap_or_else(|err| {\n                error!(\"[ FAILED ] - Konnte Ordner nicht erstellen: {}\", err);\n                process::exit(1);\n            });\n    }\n\n    pub fn create_file(\u0026self) {\n        let config = PathBuf::from(\u0026self.injection_path).join(\u0026self.name).join(\"configuration.nix\");\n        let hardware = PathBuf::from(\u0026self.injection_path).join(\u0026self.name).join(\"hardware-configuration.nix\");\n        let _ = fs::write(config, \u0026self.finished_string);\n        let _ = fs::write(hardware, \u0026self.hardware_string);\n    }\n\n    pub fn remove_dir(\u0026self) {\n        let path = PathBuf::from(\u0026self.injection_path).join(\u0026self.name);\n        fs::remove_dir_all(path)\n            .unwrap_or_else(|err| {\n                error!(\"[ FAILED ] - Konnte Ordner nicht löschen: {}\", err);\n                process::exit(1);\n            });\n    }\n\n    pub fn extract_name(content: \u0026str) -\u003e String {\n        let (_rest, network) = content.split_once(\"hostName = \").unwrap();\n        let (name, _rest) = networ : {}\", err);\n                    process::exit(1);\n                },\n            );\n        if !copy.status.success() {\n            let err = String::from_utf8_lossy(\u0026copy.stderr);\n            error!(\"[ FAILED ] - Kopieren der System-Closure fehlgeschlagen:\\n{}\", err);\n            process::exit(1);\n        }\n    } else {\n        let copy = Command::new(\"nix\")\n            .env(\"NIX_SSHOPTS\", \"-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -C\")\n            .args([\n                \"copy\",\n                \"--no-check-sigs\",\n                \"--substitute-on-destination\",\n                \"--to\",\n                \u0026format!(\"ssh-ng://root@{}?remote-store=local%3Froot%3D/mnt\", ip),\n                \"./result\",\n            ])\n            .current_dir(get_path(Paths::Nixconf))\n            .output()\n            .unwrap_or_else(|err| {\n                error!(\"Konnte nix copy nicht starten: {}\", err);\n                process::exit(1);\n            });\n        if !copy.status.success() {\n            let err = String::from_utf8_lossy(\u0026copy.stderr);\n            error!(\"[ FAILED ] - Kopieren der System-Closure fehlgeschlagen:\\n{}\", err);\n            process::exit(1);\n        }\n    }\n    info!(\"[ OK ] - Copy des Closure erfolgreich\");\n    info!(\"[ TIME ] Copy des Closure: {:?}\", start.elapsed());\n}\n\npub fn profile(ip: \u0026str) {\n    info!(\"[ RUN ] - Starte Aktivierung des Profiles\");\n\n    let system_path = fs::read_link(format!(\"{}/result\", get_path(Paths::Nixconf)))\n        .unwrap_or_else(|err| {\n            error!(\"[ FAILED ] - Konnte Symlink 'result' nicht auflösen: {}\", err);\n            process::exit(1);\n        })\n        .to_string_lossy()\n        .into_owned();\n    debug!(\"System-Pfad im Nix-Store: {}\", system_path);\n    let profile_cmd = format!(\"nix-env --store /mnt -p /mnt/nix/var/nix/profiles/system --set {}\", system_path);\n    let profile =\n        Command::new(\"ssh\").args(get_sshstring(ip, User::Root)).arg(\u0026profile_cmd).output().unwrap_or_else(|err| {\n            error!(\"Konnte 'ssh' oder 'nix' nicht starten: {}\", err);\n            process::exit(1);\n        });\n    if !profile.status.success() {\n        error!(\"[ FAILED ] - Profil-Registrierung fehlgeschlagen: {}\", String::from_utf8_lossy(\u0026profile.stderr));\n        process::exit(1);\n    }\n    info!(\"[ OK ] - Aktivierung des Profiles erfolgreich\");\n}\n\npub fn prep(ip: \u0026str) {\n    info!(\"[ RUN ] - Starte Vorbereitung des Dateisystem für nixos-enter vor\");\n\n    let prep_cmd = \"mkdir -m 0755 -p /mnt/etc \u0026\u0026 touch /mnt/etc/NIXOS\";\n    let prep = Command::new(\"ssh\").args(get_sshstring(ip, User::Root)).arg(prep_cmd).output().unwrap_or_else(|err| {\n        error!(\"Konnte 'ssh' oder 'nix' nicht starten: {}\", err);\n        process::exit(1);\n    });\n\n    if !prep.status.success() {\n        error!(\"[ FAILED ] - Vorbereitung fehlgeschlagen: {}\", String::from_utf8_lossy(\u0026prep.stderr));\n        process::exit(1);\n    }\n    info!(\"[ OK ] - Vorbereitung erfolgreich\");\n}\n\npub fn activate(ip: \u0026str) {\n    info!(\"[ RUN ] - Aktiviere das System\");\n\n    let activate_cmd =\n        \"NIXOS_INSTALL_BOOTLOADER=1 nixos-enter --root /mnt --command '/nix/var/nix/profiles/system/activate'\";\n    let activate =\n        Command::new(\"ssh\").args(get_sshstring(ip, User::Root)).arg(activate_cmd).output().unwrap_or_else(|err| {\n            error!(\"Konnte 'ssh' oder 'nix' nicht starten: {}\", err);\n            process::exit(1);\n        });\n    if !activate.status.success() {\n        error!(\"[ FAILED ] - Systemaktivierung fehlgeschlagen: {}\", String::from_utf8_lossy(\u0026activate.stderr));\n        process::exit(1);\n    }\n    info!(\"[ OK ] - Aktivierung des Systems erfolgreich\");\n}\n\npub fn bootloader(ip: \u0026str) {\n    info!(\"[ RUN ] - Starte Aktualisiere Bootloader\");\n\n    let bootloader_cmd = \"nixos-enter --root /mnt --command 'NIXOS_INSTALL_BOOTLOADER=1 /nix/var/nix/profiles/system/bin/switch-to-configuration boot'\";\n    let bootloader =\n        Command::new(\"ssh\").args(get_sshstring(ip, User::Root)).arg(bootloader_cmd).output().unwrap_or_else(|err| {\n            error!(\"Konnte 'ssh' oder 'nix' nicht starten: {}\", err);\n            process::exit(1);\n        });\n    if !bootloader.status.success() {\n        error!(\"[ FAILED ] - Bootloader Installation fehlgeschlagen: {}\", String::from_utf8_lossy(\u0026bootloader.stderr));\n        process::exit(1);\n    }\n    info!(\"[ OK ] - Aktualisierung des Bootloaders erfolgreich\");\n}\n\npub fn reboot(ip: \u0026str, debug: \u0026bool) {\n    info!(\"[ RUN ] - Logge aus Tailscale aus und starte neu...\");\n\n    if !debug {\n        let magic_cmd = \"nohup sh -c 'sleep 2 \u0026\u0026 tailscale logout \u0026\u0026 reboot' \u003e /dev/null 2\u003e\u00261 \u0026\";\n        let logout_reboot = Command::new(\"ssh\").args(get_sshstring(ip, User::Root)).arg(magic_cmd).output();\n        match logout_reboot {\n            Ok(output) =\u003e {\n                if output.status.success() {\n                    info!(\"[ OK ] - Befehl abgesetzt. Das Gerät loggt sich aus und startet neu.\");\n                } else {\n                    error!(\"[ FAILED ] - SSH Befehl schlug fehl: {}\", String::from_utf8_lossy(\u0026output.stderr));\n                }\n            }\n            Err(e) =\u003e {\n                error!(\"[ FAILED ] - Konnte SSH nicht ausführen: {}\", e);\n            }\n        }\n    }\n}\n","traces":[{"line":9,"address":[2320000,2321191,2321383],"length":1,"stats":{"Line":0}},{"line":10,"address":[2069447,2069510],"length":1,"stats":{"Line":0}},{"line":12,"address":[2320068],"length":1,"stats":{"Line":0}},{"line":13,"address":[2320318],"length":1,"stats":{"Line":0}},{"line":14,"address":[2320357],"length":1,"stats":{"Line":0}},{"line":15,"address":[2320479],"length":1,"stats":{"Line":0}},  Variable nicht extrahieren\");\n    let nixconfig = PathBuf::from(\u0026home).join(\"xanterella\").join(\"config\");\n    let nixcolmena = PathBuf::from(\u0026nixconfig).join(\"colmena-hosts.nix\");\n    let nixhosts = PathBuf::from(\u0026nixconfig).join(\"hosts\");\n    let nixmodules = PathBuf::from(\u0026nixconfig).join(\"modules\");\n    let nixprofiles = PathBuf::from(\u0026nixconfig).join(\"profiles\");\n    let config = PathBuf::from(\u0026home).join(\".config\").join(\"xanterella\");\n    let templates = PathBuf::from(\u0026config).join(\"templates\");\n    let result: PathBuf = match option {\n        Paths::Home =\u003e home.into(),\n        Paths::Nixconf =\u003e nixconfig,\n        Paths::Colmena =\u003e nixcolmena,\n        Paths::Hosts =\u003e nixhosts,\n        Paths::Modules =\u003e nixmodules,\n        Paths::Profiles =\u003e nixprofiles,\n        Paths::Config =\u003e config,\n        Paths::Templates =\u003e templates,\n    };\n    result.to_str().expect(\"[ FAILED ] - Gen Path ist fehlgeschlagen\").to_string()\n}\n\npub fn get_hardware(ip: \u0026str) -\u003e String {\n    info!(\"[ RUN ] - Generiere Hardware\");\n\n    let ssh = Command::new(\"ssh\")\n        .args(get_sshstring(ip, User::Root))\n        .arg(\"nixos-generate-config --no-filesystems --show-hardware-config\")\n        .output()\n        .unwrap_or_else(|err| {\n            error!(\"[ FAILED ] - Konnte SSH nicht starten: {}\", err);\n            process::exit(1);\n        });\n    if !ssh.status.success() {\n        error!(\"[ FAILED ] - Fehler beim erstellen der Hardware Config: {}\", String::from_utf8_lossy(\u0026ssh.stderr));\n        process::exit(1);\n    }\n\n    let hardware_config = String::from_utf8_lossy(\u0026ssh.stdout).to_string();\n    info!(\"[ OK ] - Hardware erfolgreich geneiert\");\n    debug!(\"{}\", hardware_config);\n    hardware_config\n}\n\npub fn get_drives(ip: \u0026str) -\u003e Drives {\n    info!(\"[ RUN ] - Parse Drives\");\n\n    let parsed_drives;\n    if ip != \"127.0.0.1\" {\n        let lsblk =\n            Command::new(\"ssh\").args(get_sshstring(ip, User::Root)).arg(\"lsblk\").arg(\"--json\").output().unwrap_or_else(\n                |err| {\n                    error!(\"[ FAILED ] - Konnte lsblk nicht starten: {}\", err);\n                    process::exit(1);\n                },\n            );\n        if !lsblk.status.success() {\n            error!(\n                \"[ FAILED ] - Fehler beim Auslesen der als root Partitionen: {}\",\n                String::from_utf8_lossy(\u0026lsblk.stderr)\n            );\n\n            let lsblk1 = Command::new(\"ssh\")\n                .args(get_sshstring(ip, User::Cato))\n                .arg(\"lsblk\")\n                .arg(\"--json\")\n                .output()\n                .unwrap_or_else(|err| {\n                    error!(\"[ FAILED ] - Konnte lsblk nicht starten: {}\", err);\n                    process::exit(1);\n                });\n            if !lsblk1.status.success() {\n                error!(\n                    \"[ FAILED ] - Fehler beim Auslesen der als cato Partitionen: {}\",\n                    String::from_utf8_lossy(\u0026lsblk.stderr)\n                );\n                process::exit(1);\n            } else {\n                info!(\"[ OK ] - Drives mit Cato geparsen\");\n                parsed_drives = serde_json::from_slice::\u003cDrives\u003e(\u0026lsblk1.stdout).unwrap_or_else(|err| {\n                    error!(\"[ FAILED ] - Konnte lsblk nicht parsen: {}\", err);\n                    process::exit(1);\n                });\n            }\n        } else {\n            info!(\"[ OK ] - Drives mit Root geparsen\");\n            parsed_drives = serde_json::from_slice::\u003cDrives\u003e(\u0026lsblk.stdout).unwrap_or_else(|err| {\n                error!(\"[ FAILED ] - Konnte lsblk nicht parsen: {}\", err);\n                process::exit(1);\n            });\n        }\n    } else {\n        let lsblk = Command::new(\"lsblk\").arg(\"--json\").output().unwrap_or_else(|err| {\n            error!(\"[ FAILED ] - Konnte lsblk nicht starten: {}\", err);\n            process::exit(1);\n        });\n        if !lsblk.status.success() {\n            error!(\"[ FAILED ] - Fehler beim Auslesen der Partitionen: {}\", String::from_utf8_lossy(\u0026lsblk.stderr));\n        }\n        info!(\"[ OK ] - Drives lokal geparsen\");\n\n        parsed_drives = serde_json::from_slice::\u003cDrives\u003e(\u0026lsblk.stdout).unwrap_or_else(|err| {\n            error!(\"[ FAILED ] - Konnte lsblk nicht parsen: {}\", err);\n            process::exit(1);\n        });\n    }\n    info!(\"[ OK ] - Drives erfasst\");\n    parsed_drives\n}\n\npub fn get_sort_drives(drives: Drives) -\u003e Drives {\n    let mut drives = drives;\n    drives.blockdevices.sort_by(|a, b| {\n        let size_a = get_drives_size(\u0026a.size);\n        let size_b = get_drives_size(\u0026b.size);\n        size_b.cmp(\u0026size_a)\n    });\n    drives\n}\n\npub fn get_taildevices() -\u003e Taildevices {\n    //info!(\"[ RUN ] - Parse Tailscale Geräte\");\n\n    let tail_status = Command::new(\"tailscale\").arg(\"status\").arg(\"--json\").output().unwrap_or_else(|err| {\n        error!(\"[ FAILED ] - Konnte 'tailscale status --json' nicht ausführen: {}\", err);\n        process::exit(1);\n    });\n    if !tail_status.status.success() {\n        error!(\n            \"[ FAILED ] - Tailscale Status ist Fehlgeschlagen, bist du eingelogt, wurde das JSON nicht richtig geparst: {}\",\n            String::from_utf8_lossy(\u0026tail_status.stderr)\n        );\n        process::exit(1);\n    }\n\n    //info!(\"[ OK ] - Parse Tailscale Geräte erfolgreich\");\n    serde_json::from_slice::\u003cTaildevices\u003e(\u0026tail_status.stdout).unwrap_or_else(|err| {\n        error!(\"[ FAILED ] - Konnte den Output von Tailscale nicht parsen: {}\", err);\n        process::exit(1);\n    })\n}\n\npub fn get_taildevices_specific(devices: Taildevices, name: \u0026str, active_installs: \u0026HashSet\u003cString\u003e) -\u003e Vec\u003cString\u003e {\n    let mut ips: Vec\u003cString\u003e = vec![];\n    for (_nodekey, device) in devices.devices {\n        if device.name == name \u0026\u0026 device.os == \"linux\" {\n            let ip = device.ip[0].clone();\n            if !active_installs.contains(\u0026ip) {\n                let _ = \u0026mut ips.push(ip.to_owned());\n            }\n        }\n    }\n    ips\n}\n\npub fn get_sshstring(ip: \u0026str, user: User) -\u003e Vec\u003cString\u003e {\n    let target = match user {\n        User::Root =\u003e format!(\"root@{}\", ip),\n        User::Cato =\u003e format!(\"cato@{}\", ip),\n    };\n    vec![\n        \"-o\".to_string(),\n        \"StrictHostKeyChecking=no\".to_string(),\n        \"-o\".to_string(),\n        \"UserKnownHostsFile=/dev/null\".to_string(),\n        target,\n    ]\n}\n\npub fn get_drives_name(primdrive: \u0026str, number: i8) -\u003e String {\n    let drive = format!(\"/dev/{}\", primdrive);\n    let p_suffix = if primdrive.contains(\"nvme\") || primdrive.contains(\"mmclblk\") { \"p\" } else { \"\" };\n    let partition = format!(\"{}{}{}\", drive, p_suffix, number);\n    partition\n}\n\npub fn get_iso(mode: FlashMode, ip: \u0026str) -\u003e String {\n    match mode {\n        FlashMode::Local =\u003e {\n            info!(\"[ RUN ] - Finde ISO lokal\");\n\n            let iso_path = std::path::PathBuf::from(get_path(Paths::Nixconf)).join(\"result\").join(\"iso\");\n            let entries = fs::read_dir(\u0026iso_path).unwrap_or_else(|err| {\n                error!(\"[ FAILED ] - Konnte den Result Ordner nicht auslesen: {}\", err);\n                process::exit(1);\n            });\n\n            for i in entries {\n                if let Ok(file) = i {\n                    let path: std::path::PathBuf = file.path();\n                    if path.is_file() \u0026\u0026 path.extension().unwrap_or_default() == \"iso\" {\n                        let target_path = path.to_string_lossy().into_owned();\n                        info!(\"[ OK ] - ISO gefunden\");\n                        return target_path;\n                    }\n                }\n            }\n            error!(\"[ FAILED ] - Keine .iso Datei im result Ordner gefunden\");\n            process::exit(1);\n        }\n        FlashMode::Remote =\u003e {\n            info!(\"[ RUN ] - Finde ISO remote\");\n\n            let iso_path = format!(\"realpath {}/result/iso/*.iso\", get_path(Paths::Nixconf));\n            let realpath =\n                Command::new(\"ssh\")\n                    .args(get_sshstring(ip, User::Root))\n                    .arg(iso_path)\n                    .output()\n                    .unwrap_or_else(|err| {\n                        error!(\"[ FAILED ] - Konnte den Result Ordner nicht auslesen: {}\", err);\n                        process::exit(1);\n                    });\n            if !realpath.status.success() {\n                error!(\"[ FAILED ] - Kontte den Result Ordner nicht auslesen: {}\", String::from_utf8_lossy(\u0026realpath.stderr));\n                process::exit(1);\n            }\n            let output = String::from_utf8_lossy(\u0026realpath.stdout).trim().to_string();\n            debug!(\"ISO Remote Path: {}\", output);\n            output\n        }\n    }\n}\n\npub fn get_drives_size(size_str: \u0026str) -\u003e u64 {\n    let size_str = size_str.trim().to_uppercase();\n    let mut multiplier: f64 = 1.0;\n    let mut num_str = size_str.as_str();\n\n    if size_str.ends_with('T') {\n        multiplier = 1024.0 * 1024.0 * 1024.0 * 1024.0;\n        num_str = \u0026size_str[..size_str.len() - 1];\n    } else if size_str.ends_with('G') {\n        multiplier = 1024.0 * 1024.0 * 1024.0;\n        num_str = \u0026size_str[..size_str.len() - 1];\n    } else if size_str.ends_with('M') {\n        multiplier = 1024.0 * 1024.0;\n        num_str = \u0026size_str[..size_str.len() - 1];\n    }\n\n    let val: f64 = num_str.parse().unwrap_or(0.0);\n\n    (val * multiplier) as u64\n}\n\n#[cfg(test)]\n#[path = \"get_test.rs\"]\nmod tests;\n","traces":[{"line":59,"address":[1800354,1797088,1800194],"length":1,"stats":{"Line":1}},{"line":60,"address":[1590648],"length":1,"stats":{"Line":1}},{"line":61,"address":[1797297,1797365],"length":1,"stats":{"Line":2}},{"line":62,"address":[1591248],"length":1,"stats":{"Line":1}},{"line":63,"address":[2145223],"length":1,"stats":{"Line":1}},{"line":64,"address":[2145438],"length":1,"stats":{"Line":1}},{"line":65,"address":[2145647],"length":1,"stats":{"Line":1}},{"line":66,"address":[1798570],"length":1,"stats":{"Line":1}},{"line":67,"address":[2146221],"length":1,"stats":{"Line":1}},{"line":68,"address":[1592603],"length":1,"stats":{"Line":1}},{"line":69,"address":[2146462,2146957],"length":1,"stats":{"Line":0}},{"line":70,"address":[1799259],"length":1,"stats":{"Line":1}},{"line":71,"address":[1799561],"length":1,"stats":{"Line":0}},{"line":72,"address":[1592772],"length":1,"stats":{"Line":0}},{"line":73,"address":[2146661],"length":1,"stats":{"Line":0}},{"line":74,"address":[2146722],"length":1,"stats":{"Line":0}},{"line":75,"address":[1592955],"length":1,"stats":{"Line":0}},{"line":76,"address":[2146899],"length":1,"stats":{"Line":0}},{"line":78,"address":[2146967,2147038],"length":1,"stats":{"Line":2}},{"line":81,"address":[1786386,1787282,1785168],"length":1,"stats":{"Line":0}},{"line":82,"address":[2132609,2132503],"length":1,"stats":{"Line":0}},{"line":84,"address":[1785260],"length":1,"stats":{"Line":0}},{"line":85,"address":[1785305,1785565],"length":1,"stats":{"Line":0}},{"line":88,"address":[1991383,1991389,1990992],"length":1,"stats":{"Line":0}},{"line":89,"address":[1991110,1991004,1991085],"length":1,"stats":{"Line":0}},{"line":90,"address":[1936499],"length":1,"stats":{"Line":0}},{"line":92,"address":[1579383],"length":1,"stats":{"Line":0}},{"line":93,"address":[1785798,1785913,1785888],"length":1,"stats":{"Line":0}},{"line":94,"address":[2133174]      \"TailscaleIPs\": [\"100.104.200.35\", \"fd7a:115c:a1e0::6739:c823\"],\n                    \"OS\": \"linux\"\n                }\n            }\n        }\"#;\n        let parsed: Taildevices = serde_json::from_str(mock_json).expect(\"JSON Parser ist fehlgeschlagen\");\n        let redmi_key = \"nodekey:242c6813b0d0bd1e74d701aa31a405843156713124d72d1738ab058c193cd525\";\n        let redmi_device = parsed.devices.get(redmi_key).expect(\"Redmi Nodekey nicht in HashMap gefunden!\");\n        assert_eq!(parsed.devices.len(), 2);\n        assert_eq!(redmi_device.name, \"Redmi Note 13 Pro\");\n        assert_eq!(redmi_device.os, \"android\");\n        assert_eq!(redmi_device.ip[0], \"100.124.213.38\");\n    }\n    #[test]\n    fn test_get_drives_size() {\n        let size = \"1M\";\n        assert_eq!(get_drives_size(\u0026size), 1048576);\n    }\n    #[test]\n    fn test_serde_json_convert_lsblk() {\n        let mock_json = r#\"{\n            \"blockdevices\": [\n                {\n                    \"name\": \"nvme0n1\",\n                    \"size\": \"1T\",\n                    \"type\": \"disk\"\n                },\n                {\n                    \"name\": \"sda\",\n                    \"size\": \"500G\",\n                    \"type\": \"disk\"\n                },\n                {\n                    \"name\": \"sda1\",\n                    \"size\": \"500G\",\n                    \"type\": \"part\"\n                }\n            ]\n        }\"#;\n        let parsed: Drives = serde_json::from_str(mock_json).expect(\"Konnte das JSON nicht formatieren\");\n        assert_eq!(parsed.blockdevices.len(), 3);\n        assert_eq!(parsed.blockdevices[0].name, \"nvme0n1\");\n        assert_eq!(parsed.blockdevices[0].size, \"1T\");\n        assert_eq!(parsed.blockdevices[0].device_type, \"disk\");\n        assert_eq!(parsed.blockdevices[2].name, \"sda1\");\n        assert_eq!(parsed.blockdevices[2].device_type, \"part\");\n    }\n    #[test]\n    fn test_get_sort_drives() {\n        let mock_json = r#\"{\n            \"blockdevices\": [\n                {\n                    \"name\": \"nvme0n1\",\n                    \"size\": \"1T\",\n                    \"type\": \"disk\"\n                },\n                {\n                    \"name\": \"sda\",\n                    \"size\": \"500G\",\n                    \"type\": \"disk\"\n                },\n                {\n                    \"name\": \"sdb1\",\n                    \"size\": \"800G\",\n                    \"type\": \"part\"\n                },\n                {\n                    \"name\": \"sdc1\",\n                    \"size\": \"600G\",\n                    \"type\": \"part\"\n                },\n                {\n                    \"name\": \"sdd1\",\n                    \"size\": \"400G\",\n                    \"type\": \"part\"\n                }\n            ]\n        }\"#;\n        let parsed: Drives = serde_json::from_str(mock_json).expect(\"Konnte das JSON nicht formatieren\");\n        let sorted: Drives = get_sort_drives(parsed);\n        assert_eq!(sorted.blockdevices.len(), 5);\n        assert_eq!(sorted.blockdevices[0].name, \"nvme0n1\");\n        assert_eq!(sorted.blockdevices[0].size, \"1T\");\n        assert_eq!(sorted.blockdevices[0].device_type, \"disk\");\n        assert_eq!(sorted.blockdevices[1].name, \"sdb1\");\n        assert_eq!(sorted.blockdevices[1].device_type, \"part\");\n        assert_eq!(sorted.blockdevices[4].name, \"sdd1\");\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","cato","xanterella","cli","xanterella","src","utils","git.rs"],"content":"use log::{debug, error, info};\n\nuse std::process::{self, Command};\n\nuse crate::utils::get::*;\n\npub enum Branches {\n    Xanterella,\n    Main,\n}\n\npub fn git_full(cm_msg: String) {\n    info!(\"[ RUN ] - Starte Git Prozedur\");\n\n    let diff =\n        Command::new(\"git\").args([\"diff\", \"--stat\"]).current_dir(get_path(Paths::Nixconf : bool,\n    pub imports: Vec\u003cString\u003e,\n    pub deploy_block: String,\n    pub finished_string: String,\n}\n\nimpl ColmenaManager {\n    pub fn init(injection_path: \u0026str) -\u003e Self {\n        Self {\n            hosts: vec![],\n            injection_path: injection_path.to_string(),\n            content: String::new(),\n        }\n    }\n\n    pub fn load(\u0026mut self) {\n        self.get_content();\n        self.parse_hosts();\n    }\n\n    pub fn get_content(\u0026mut self) {\n        self.alejandra();\n        self.content = fs::read_to_string(\u0026self.injection_path).expect(\"[ FAILED ] - Konnte die Colmena Host Datei nicht auslesen\");\n    }\n\n    pub fn gen_finished_string(\u0026self) -\u003e String {\n        let mut output = vec![];\n        for i in \u0026self.hosts {\n            output.push(i.finished_string.clone())\n        }\n        output.join(\"\\n\")\n    }\n\n    pub fn parse_hosts(\u0026mut self) {\n        for i in Self::content_split_hosts(\u0026self.content_split_marker()) {\n            self.hosts.push(ColmenaHost::new_from_content(\u0026i))\n        };\n    }\n\n    pub fn write(\u0026self) {\n        let _ = fs::write(\u0026self.injection_path, \u0026self.content_replace());\n        self.alejandra();\n    }\n\n    pub fn content_replace(\u0026self) -\u003e String {\n        let output = self.content.replace(\u0026self.content_split_marker(), \u0026self.gen_finished_string());\n        output\n    }\n\n    fn content_split_marker(\u0026self) -\u003e String {\n        let (_start, hosts_start) = self.content\n            .split_once(\"# --- Xanterella Hosts Start ---\")\n            .expect(\"[ FAILED ] - Konnte die Colmena Hosts nicht zerschneiden(# --- Xanterella Hosts Start ---)\");\n        let (host_final, _end) = hosts_start\n            .split_once(\"# --- Xanterella Hosts End ---\")\n            .expect(\"[ FAILED ] - Konnte die Colmena Hosts nicht zerschneiden(# --- Xanterella Hosts End ---)\");\n        host_final.to_string()\n    }\n\n    pub fn content_split_hosts(content: \u0026str) -\u003e Vec\u003cString\u003e {\n        let teile: Vec\u003c\u0026str\u003e = content.trim().split(\"];\\n  };\\n\").collect();\n        let mut output: Vec\u003cString\u003e = vec![];\n        debug!(\"colmena_split_hosts(input): \\n{:#?}\\n - - - - - - - - - - - - - - - - - - - - - - - - \", output);\n        for i in teile {\n            if !i.trim().is_empty() {\n                output.push(format!(\"{} ]; }}; \", i.trim()))\n            }\n        }\n        debug!(\"colmena_split_hosts(output): \\n{:#?}\\n - - - - - - - - - - - - - - - - - - - - - - - - \", output);\n        output\n    }\n\n    pub fn check_for_host(\u0026self, name: Option\u003c\u0026str\u003e, ip: Option\u003c\u0026str\u003e) -\u003e bool {\n        self.hosts.iter().any(|host| {\n            return match (name, ip) {\n                (Some(search_name), None) =\u003e host.name == search_name,\n                (None, Some(search_ip)) =\u003e host.ip == search_ip,\n                (Some(search_name), Some(search_ip)) =\u003e host.name == search_name \u0026\u0026 host.ip == search_ip,\n                (None, None) =\u003e false,\n            };\n        })\n    }\n\n    pub fn sort_hosts(\u0026mut self) {\n        self.hosts.sort_by(|a, b| a.name.cmp(\u0026b.name));\n    }\n\n    pub fn add_host(\u0026mut self, name: \u0026str, ip: \u0026str, builder: bool) {\n        if !self.check_for_host(Some(name), Some(ip)) {\n            self.hosts.push(ColmenaHost::new(name, ip, builder, vec![]))\n        } else {\n            error!(\"[ FAILED ] - Host existiert schon\");\n        }\n    }\n\n    pub fn remove_host(\u0026mut self, name: Option\u003c\u0026str\u003e, ip: Option\u003c\u0026str\u003e) {\n        self.hosts.retain(|host| {\n            let matches = match (name, ip) {\n                (Some(search_name), None) =\u003e host.name == search_name,\n                (None, Some(search_ip)) =\u003e host.ip == search_ip,\n                (Some(search_name), Some(search_ip)) =\u003e host.name == search_name \u0026\u0026 host.ip == search_ip,\n                (None, None) =\u003e false,\n            };\n            !matches\n        })\n    }\n\n    pub fn alejandra(\u0026self) {\n        let alejandra = Command::new(\"alejandra\")\n            .arg(\u0026self.injection_path)\n            .output()\n            .unwrap_or_else(|err| {\n                error!(\"[ FAILED ] - Konnte Alejandra nicht starten: {}\", err);\n                //process::exit(1);\n                panic!(\"Alejandra 1\");\n            });\n        if !alejandra.status.success() {\n            error!(\n                \"[ FAILED ] - Konnte die Dateien mit Alejandra nicht formatieren: {}\",\n                String::from_utf8_lossy(\u0026alejandra.stderr)\n            );\n            //process::exit(1);\n            panic!(\"Alejandra 2\");\n        }\n        info!(\"[ OK ] - Alejandra erfolgreich\");\n    }\n}\n\nimpl ColmenaHost {\n    pub fn new(name: \u0026str, ip: \u0026str, builder: bool, input_imports: Vec\u003cString\u003e) -\u003e Self {\n        let imports = Self::gen_imports(name, input_imports);\n        let deploy_block = Self::gen_deploy_block(builder, ip);\n        let finished_string = Self::gen_finished_string(name, ip, \u0026deploy_block, \u0026imports);\n        Self {\n            name: name.to_string(),\n            ip: ip.to_string(),\n            builder,\n            imports,\n            deploy_block,\n            finished_string,\n        }\n    }\n\n    pub fn new_from_content(content: \u0026str) -\u003e Self {\n        let name = Self::extract_name(content);\n        let ip = Self::extract_ip(content);\n        let builder = Self::extract_builder(content);\n        let imports = Self::extract_imports(content);\n        let deploy_block = Self::gen_deploy_block(builder, \u0026ip);\n        let finished_string = Self::gen_finished_string(\u0026name, \u0026ip, \u0026deploy_block, \u0026imports);\n        Self {\n            name,\n            ip,\n            builder,\n            imports,\n            deploy_block,\n            finished_string,\n        }\n    }\n\n    fn extract_name(content: \u0026str) -\u003e String {\n        let (name, _rest) = content.trim().split_once(\" = {\").expect(\u0026format!(\"[ FAILED ] - Fehler beim extrahieren des Names: {}\", content));\n        name.trim().to_string()\n    }\n\n    fn extract_ip(content: \u0026str) -\u003e String {\n        let (_rest, ip_teil) = content.split_once(\"targetHost = \").unwrap();\n        let (ip, _rest) = ip_teil.split_once(\";\").unwrap();\n        ip.replace('\"', \"\")\n    }\n\n    fn extract_builder(content: \u0026str) -\u003e bool {\n        let (_rest, remote_teil) = content.split_once(\"buildOnTarget = \").unwrap();\n        let (remote, _rest) = remote_teil.split_once(\";\").unwrap();\n        let remote_builder = remote.trim().parse::\u003cbool\u003e().unwrap();\n        remote_builder\n    }\n\n    fn extract_imports(content: \u0026str) -\u003e Vec\u003cString\u003e {\n        let (_rest, remote_teil) = content.split_once(\"imports = [\").unwrap();\n        let (remote, _rest) = remote_teil.split_once(\"];\").unwrap();\n        let mut output: Vec\u003cString\u003e = vec![];\n        for i in remote.trim().lines() {\n            output.push(i.trim().to_string())\n        }\n        output\n    }\n\n    fn gen_imports(name: \u0026str, input_imports: Vec\u003cString\u003e) -\u003e Vec\u003cString\u003e {\n        let mut output_vec: Vec\u003cString\u003e = vec![\n            format!(\"./hosts/{}/configuration.nix\", name),\n            \"./profiles/ssh-keys.nix\".to_string(),\n        ];\n        output_vec.extend(input_imports);\n        output_vec.sort();\n        output_vec.dedup();\n        output_vec\n    }\n\n    fn gen_deploy_block(builder: bool, ip: \u0026str) -\u003e String {\n        if builder {\n            String::from(\"targetHost = null;\\nallowLocalDeployment = true;\\nbuildOnTarget = true;\")\n        } else {\n            format!(\"targetHost = \\\"{}\\\";\\nkeys = commonSSHKeys;\\nbuildOnTarget = false;\", ip)\n        }\n    }\n\n    fn gen_finished_string(name: \u0026str, ip: \u0026str, deploy_block: \u0026str, imports: \u0026Vec\u003cString\u003e) -\u003e String {\n        format!(\"\n        {} = {{\n        deployment = {{\n        {}\n        }};\n        imports = [\n        {}\n        ];\n        }};\\n\",\n        name, deploy_block, imports.join(\"\\n\"))\n    }\n}\n\n#[cfg(test)]\n#[path = \"colmena_test.rs\"]\nmod test;\n","traces":[{"line":26,"address":[1961224,1961218,1960960],"length":1,"stats":{"Line":6}},{"line":28,"address":[1838713],"length":1,"stats":{"Line":13}},{"line":29,"address":[2191948],"length":1,"stats":{"Line":6}},{"line":30,"address":[1961079],"length":1,"stats":{"Line":13}},{"line":34,"address":[1961248],"length":1,"stats":{"Line":12}},{"line":35,"address":[1838958],"length":1,"stats":{"Line":12}},{"line":36,"address":[1961273],"length":1,"stats":{"Line":11}},{"line":39,"address":[1835151,1835024],"length":1,"stats":{"Line":1}},{"line":40,"address":[1957246],"length":1,"stats":{"Line":1}},{"line":41,"address":[1957260,1957344,1957402],"length":1,"stats":{"Line":13}},{"line":44,"address":[1960624,1960630,1960288],"length":1,"stats":{"Line":2}},{"line":45,"address":[2191246],"length":1,"stats":{"Line":10}},{"line":46,"address":[2191337,2191265],"length":1,"stats":{"Line":14}},{"line":47,"address":[2191419,2191526],"length":1,"stats":{"Line":14}},{"line":49,"address":[1838231],"length":1,"stats":{"Line":3}},{"line":52,"address":[2188368,2188890,2188896],"length":1,"stats":{"Line":2}},{"line":53,"address":[1957711,1957551,1957473],"length":1,"stats":{"Line":36}},{"line":54,"address":[2188825,2188716],"length":1,"stats":{"Line":14}},{"line":58,"address":[2192224,2192387,2192381],"length":1,"stats":{"Line":1}},{"line":59,"address":[2192240],"length":1,"stats":{"Line":9}},{"line":60,"a "));\n        assert!(result.contains(\"buildOnTarget = false;\"));\n        assert!(result.contains(\"keys = commonSSHKeys;\"));\n        assert!(result.contains(\"imports = [\"));\n        assert!(!result.contains(\"targetHost = null\"));\n        assert!(result.contains(\"];\"));\n        assert!(result.contains(\"};\"));\n    }\n\n    #[test]\n    fn test_colmena_sort() {\n        let mut file = ColmenaManager::init(\"/dummy/path\");\n        file.hosts = vec![\n            create_dummy_host(\"zeta\"),\n            create_dummy_host(\"alpha\"),\n            create_dummy_host(\"omega\"),\n            create_dummy_host(\"beta\"),\n        ];\n        \n        file.sort_hosts(); \n        \n        assert_eq!(file.hosts.len(), 4);\n        assert_eq!(file.hosts[0].name, \"alpha\");\n        assert_eq!(file.hosts[1].name, \"beta\");\n        assert_eq!(file.hosts[2].name, \"omega\");\n        assert_eq!(file.hosts[3].name, \"zeta\");\n    }\n\n    #[test]\n    fn test_colmena_sort_already() {\n        let mut file = ColmenaManager::init(\"/dummy/path\");\n        file.hosts = vec![create_dummy_host(\"crylia\"), create_dummy_host(\"todesstern\")];\n        \n        file.sort_hosts();\n        \n        assert_eq!(file.hosts[0].name, \"crylia\");\n        assert_eq!(file.hosts[1].name, \"todesstern\");\n    }\n\n    #[test]\n    fn test_colmena_sort_case_sens() {\n        let mut file = ColmenaManager::init(\"/dummy/path\");\n        file.hosts = vec![create_dummy_host(\"Zeta\"), create_dummy_host(\"alpha\")];\n        file.sort_hosts();\n        assert_eq!(file.hosts[0].name, \"Zeta\"); \n        assert_eq!(file.hosts[1].name, \"alpha\");\n    }\n\n    #[test]\n    fn test_colmena_gen_finished_string() {\n        let mut file = ColmenaManager::init(\"/dummy/path\");\n        file.hosts = vec![create_dummy_host(\"alpha_node\"), create_dummy_host(\"beta_node\")];\n        \n        let result = file.gen_finished_string();\n        \n        assert!(result.contains(\"alpha_node = {\"));\n        assert!(result.contains(\"beta_node = {\"));\n        assert!(result.contains('\\n'));\n    }\n\n    #[test]\n    fn test_colmena_replace_content() {\n        let mut file = ColmenaManager::init(\"/dummy/path\");\n        file.content = \"Dies ist ein Test.\\n# --- Xanterella Hosts Start ---\\nAlter Inhalt\\n# --- Xanterella Hosts End ---\\nEnde.\".to_string();\n        file.hosts = vec![create_dummy_host(\"new_node\")];\n        \n        let result = file.content_replace();\n        \n        assert!(result.contains(\"Dies ist ein Test.\"));\n        assert!(result.contains(\"new_node = {\"));\n        assert!(!result.contains(\"Alter Inhalt\")); \n        assert!(result.contains(\"Ende.\"));\n    }\n    const MOCK_COLMENA_FILE: \u0026str = r#\"\n  };\n  # --- Xanterella Hosts Start ---\n  xeravus = {\n    deployment = {\n      targetHost = null;\n      allowLocalDeployment = true;\n      buildOnTarget = true;\n    };\n    imports = [\n      ./hosts/xeravus/configuration.nix\n      ./profiles/ssh-keys.nix\n    ];\n  };\n  vicuna = {\n    deployment = {\n      targetHost = \"192.168.178.30\";\n      targetUser = taruser;\n      buildOnTarget = false;\n      keys = commonSSHKeys;\n    };\n    imports = [\n      ./hosts/vicuna/configuration.nix\n      ./profiles/ssh-keys.nix\n      inputs.nixos-hardware.nixosModules.raspberry-pi-5\n    ];\n  };\n  # --- Xanterella Hosts End ---\n}\n\"#;\n\n    const MOCK_VICUNA_BLOCK: \u0026str = r#\"  vicuna = {\n    deployment = {\n      targetHost = \"192.168.178.30\";\n      targetUser = taruser;\n      buildOnTarget = false;\n      keys = commonSSHKeys;\n    };\n    imports = [\n      ./hosts/vicuna/configuration.nix\n      ./profiles/ssh-keys.nix\n      inputs.nixos-hardware.nixosModules.raspberry-pi-5\n    ];\n  };\"#;\n\n    const MOCK_XERAVUS_BLOCK: \u0026str = r#\"  xeravus = {\n    deployment = {\n      targetHost = null;\n      allowLocalDeployment = true;\n      buildOnTarget = true;\n    };\n    imports = [\n      ./hosts/xeravus/configuration.nix\n    ];\n  };\"#;\n\n    #[test]\n    fn test_colmena_add_host_from_content1() {\n        let host = ColmenaHost::new_from_content(MOCK_VICUNA_BLOCK);\n        \n        assert_eq!(host.name, \"vicuna\");\n        assert_eq!(host.ip, \"192.168.178.30\");\n        assert_eq!(host.builder, false);\n        assert_eq!(host.imports.len(), 3);\n        assert_eq!(host.imports[0], \"./hosts/vicuna/configuration.nix\");\n        assert_eq!(host.imports[2], \"inputs.nixos-hardware.nixosModules.raspberry-pi-5\");\n    }\n\n    #[test]\n    fn test_colmena_add_host_from_content2() {\n        let host = ColmenaHost::new_from_content(MOCK_XERAVUS_BLOCK);\n        \n        assert_eq!(host.name, \"xeravus\");\n        assert_eq!(host.ip, \"null\"); \n        assert_eq!(host.builder, true);\n    }\n\n    #[test]\n    fn test_colmena_file_parse_hosts() {\n        let mut file = ColmenaManager::init(\"/dummy/path\");\n        file.content = MOCK_COLMENA_FILE.to_string();\n        \n        file.parse_hosts();\n        for i in \u0026file.hosts {\n            println!(\"{:#?}\", i);\n        }\n        \n        assert_eq!(file.hosts.len(), 2);\n        \n        assert_eq!(file.hosts[0].name, \"xeravus\");\n        assert_eq!(file.hosts[0].builder, true);\n        \n        assert_eq!(file.hosts[1].name, \"vicuna\");\n        assert_eq!(file.hosts[1].ip, \"192.168.178.30\");\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","cato","xanterella","cli","xanterella","src","config","core.rs"],"content":"use log::{info, debug};\n\nuse crate::utils::core::*;\nuse crate::config::query::*;\nuse crate::config::filepaths::*;\nuse crate::config::colmena::*;\n\nuse crate::config::xanterella::host::*;\n\npub fn list_hosts() {\n    info!(\"Hosts: \");\n    for i in query_hosts() {\n        info!(\"{}\", convert_filepath(\u0026i, OutPath::Last, false));\n    }\n}\n\npub fn host_add(injection_path: \u0026str, name: \u0026str, ip: \u0026str, remotebuilder: bool, sysversion: Option\u003cf32\u003e, hardware_string: Option\u003cString\u003e) {\n    colmena_add(\u0026convert_path(injection_path, Target::Colmena), name, ip, remotebuilder);\n    xanterella_add_host(\u0026convert_path(injection_path, Target::Hosts), name, sysversion, hardware_string);\n}\n\npub fn host_remove(injection_path: \u0026str, name: \u0026str, ip: Option\u003c\u0026str\u003e) {\n    colmena_remove(\u0026convert_path(injection_path, Target::Colmena), Some(name), ip);\n    xanterella_remove_host(\u0026convert_path(injection_path, Target::Hosts), name);\n}\n\npub fn sort_host(injection_path: \u0026str) {\n    colmena_rewrite(\u0026convert_path(injection_path, Target::Colmena));\n    xanterella_sort_hosts(\u0026convert_path(injection_path, Target::Hosts));\n}\n\npub fn colmena_add(injection_path: \u0026str, name: \u0026str, ip: \u0026str, remotebuilder: bool) {\n    info!(\"[ RUN ] - Füge Host: {} hinzu zu Colmena\", name);\n\n    let mut colmena = ColmenaManager::init(injection_path);\n    colmena.load();\n    colmena.add_host(name, ip, remotebuilder);\n    colmena.sort_hosts();\n    colmena.write();\n    files_alejandra(injection_path);\n    info!(\"[ OK ] - Host: {} erfolgreich zu Colmena hinzugefügt\", name);\n}\n\npub fn colmena_remove(injection_path: \u0026str, name: Option\u003c\u0026str\u003e, ip: Option\u003c\u0026str\u003e) {\n    info!(\"[ RUN ] - Lösche Host aus Colmena\");\n    \n    let mut colmena = ColmenaManager::init(injection_path);\n    colmena.load();\n    colmena.remove_host(name, ip);\n    colmena.sort_hosts();\n    colmena.write();\n    files_alejandra(injection_path);\n    info!(\"[ OK ] - Host erfolgreich gelöscht aus Colmena\");\n}\n\npub fn colmena_rewrite(injection_path: \u0026str) {\n    info!(\"[ RUN ] - Starte Reload der Colmena Hosts\");\n\n    let mut colmena = ColmenaManager::init(injection_path);\n    colmena.load();\n    colmena.sort_hosts();\n    colmena.write();\n    files_alejandra(injection_path);\n    info!(\"[ OK ] - Reload der Colmena Hosts erfolgreich\");\n}\n\npub fn xanterella_add_host(injection_path: \u0026str, name: \u0026str, sysversion: Option\u003cf32\u003e, hardware_string: Option\u003cString\u003e) {\n    info!(\"[ RUN ] - Füge Host: {} zu Xanterella hinzu\", name);\n\n    let mut xanterella = XanterellaHostManager::init(injection_path);\n    xanterella.load();\n    xanterella.add_host(name, sysversion, hardware_string);\n    xanterella.clean();\n    xanterella.write();\n    files_alejandra(injection_path);\n    info!(\"[ OK ] - Host: {} erfolgrecih zu Xanterella hinzugefügt\", name);\n}\n\npub fn xanterella_remove_host(injection_path: \u0026str, name: \u0026str) {\n    info!(\"[ RUN ] - Lösche Host aus Xanterella\");\n    \n    let mut xanterella = XanterellaHostManager::init(injection_path);\n    xanterella.load();\n    xanterella.remove_host(name);\n    xanterella.clean();\n    xanterella.write();\n    files_alejandra(injection_path);\n    info!(\"[ OK ] - Host erfolgreich gelöscht aus Colmena\");\n}\n\npub fn xanterella_sort_hosts(injection_path: \u0026str) {\n    info!(\"[ RUN ] - Starte Reload der Xanterella Hosts\");\n\n    let mut xanterella = XanterellaHostManager::init(injection_path);\n    xanterella.load();\n    xanterella.clean();\n    xanterella.write();\n    files_alejandra(injection_path);\n    info!(\"[ OK ] - Reload der Xanterella Hosts erfolgreich\");\n}\n\npub fn list_modules() {\n    info!(\"Modules: \");\n    for i in query_modules_all() {\n        info!(\"{}\", convert_filepath(\u0026i, OutPath::Shortend, false));\n    }\n}\n\npub fn list_profiles() {\n    info!(\"Profiles: \");\n    for i in query_profiles() {\n        info!(\"{}\", convert_filepath(\u0026i, OutPath::Shortend, false));\n    }\n}\n","traces":[{"line":10,"address":[1923490,1922480,1923484],"length":1,"stats":{"Line":0}},{"line":11,"address":[1922487,1922622],"length":1,"stats":{"Line":0}},{"line":12,"address":[2043268,2042998,2043339],"   pub injection_path: String,\n}\n\nimpl XanterellaHostManager {\n    pub fn init(injection_path: \u0026str) -\u003e Self {\n        Self {\n            hosts: vec![],\n            injection_path: injection_path.to_string(),\n        }\n    }\n\n    pub fn load(\u0026mut self) {\n        let hosts = self.list_hosts();\n        self.alejandra();\n        for i in hosts {\n            let path = PathBuf::from(\u0026self.injection_path).join(i).join(\"configuration\");\n            let content = fs::read_to_string(path).unwrap();\n            self.hosts.push(XanterellaHost::new_from_content(\u0026self.injection_path, \u0026content))\n        }\n    }\n\n    pub fn alejandra(\u0026self) {\n        let alejandra = Command::new(\"alejandra\")\n            .arg(\u0026self.injection_path)\n            .output()\n            .unwrap_or_else(|err| {\n                error!(\"[ FAILED ] - Konnte Alejandra nicht starten: {}\", err);\n                //process::exit(1);\n                panic!(\"Alejandra 1\");\n            });\n        if !alejandra.status.success() {\n            error!(\n                \"[ FAILED ] - Konnte die Dateien mit Alejandra nicht formatieren: {}\",\n                String::from_utf8_lossy(\u0026alejandra.stderr)\n            );\n            //process::exit(1);\n            panic!(\"Alejandra 2\");\n        }\n        info!(\"[ OK ] - Alejandra erfolgreich\");\n    }\n\n    pub fn list_hosts(\u0026self) -\u003e Vec\u003cString\u003e {\n        WalkDir::new(\u0026self.injection_path)\n            .min_depth(1)\n            .sort_by_file_name()\n            .into_iter()\n            .filter_map(|entry| entry.ok())\n            .filter(|entry| entry.file_type().is_dir())\n            .filter_map(|entry| {\n                entry.path().to_str().map(|s| s.to_string())\n            })\n            .collect()\n    }\n\n    pub fn check_for_host(\u0026self, name: \u0026str) -\u003e bool {\n        self.hosts.iter().any(|h| h.name == name)\n    }\n\n    pub f ontent: \u0026str) -\u003e Self {\n        let name = Self::extract_name(content);\n        let sysversion = Self::extract_sysversion(content);\n        let imports = Self::extract_imports(content);\n        let hardware = Self::extract_hardware(injection_path, \u0026name);\n        let extra_attributes = Self::extract_extra_attributes(content, \u0026imports);\n        let finished_string = Self::gen_finished_string(\u0026name, sysversion, \u0026imports, \u0026extra_attributes);\n        Self {\n            name,\n            sysversion,\n            imports,\n            finished_string,\n            hardware_string: hardware,\n            extra_attributes,\n            injection_path: injection_path.to_string(),\n        }\n    }\n\n    pub fn create_dir(\u0026self) {\n        let path = PathBuf::from(\u0026self.injection_path).join(\u0026self.name);\n        fs::create_dir_all(path)\n            .unwrap_or_else(|err| {\n                error!(\"[ FAILED ] - Konnte Ordner nicht erstellen: {}\", err);\n                process::exit(1);\n            });\n    }\n\n    pub fn create_file(\u0026self) {\n        let config = PathBuf::from(\u0026self.injection_path).join(\u0026self.name).join(\"configuration.nix\");\n        let hardware = PathBuf::from(\u0026self.injection_path).join(\u0026self.name).join(\"hardware-configuration.nix\");\n        let _ = fs::write(config, \u0026self.finished_string);\n        let _ = fs::write(hardware, \u0026self.hardware_string);\n    }\n\n    pub fn remove_dir(\u0026self) {\n        let path = PathBuf::from(\u0026self.injection_path).join(\u0026self.name);\n        fs::remove_dir_all(path)\n            .unwrap_or_else(|err| {\n                error!(\"[ FAILED ] - Konnte Ordner nicht löschen: {}\", err);\n                process::exit(1);\n            });\n    }\n\n    pub fn extract_name(content: \u0026str) -\u003e String {\n        let (_rest, network) = content.split_once(\"hostName = \").unwrap();\n        let (name, _rest) = net ","xanterella","src","utils","filesystem.rs"],"content":"use log::{info, debug};\n\nuse std::fs;\nuse std::{self, Command};\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","cato","xanterella","cli","xanterella","src","utils","get.rs"],"content":"use log::{debug, error, info};\nuse serde::Deserialize;\n\nuse std::collections::HashMap;\nuse std::collections::HashSet;\nuse std::env;\nuse std::fs;\nuse std::path::*;\nuse std::process::{self, Command};\n\nuse crate::usb::flash::*;\n\n#[derive(Deserialize, Debug)]\npub struct Drives {\n    pub blockdevices: Vec\u003cBlockDevice\u003e,\n}\n\n#[derive(Deserialize, Debug)]\npub struct BlockDevice {\n    pub name: String,\n    pub size: String,\n\n    #[serde(rename = \"type\")]\n    pub device_type: String,\n}\n\n#[derive(serde::Deserialize, Debug)]\npub struct Taildevices {\n    #[serde(rename = \"Peer\")]\n    pub devices: HashMap\u003cString, DeviceInfo\u003e,\n}\n\n#[derive(serde::Deserialize, Debug)]\npub struct DeviceInfo {\n    #[serde(rename = \"HostName\")]\n    pub name: String,\n    #[serde(rename = \"TailscaleIPs\")]\n    pub ip: Vec\u003cString\u003e,\n    #[serde(rename = \"OS\")]\n    pub os: String,\n}\n\npub enum Paths {\n    Home,\n    Nixconf,\n    Hosts,\n    Modules,\n    Profiles,\n    Config,\n    Colmena,\n    Templates,\n}\n\npub enum User {\n    Root,\n    Cato,\n}\n\npub fn get_path(option: Paths) -\u003e String {\n    let home = env::var(\"HOME\").expect(\"[ FAILED ] - Konnte die Home Variable nicht extrahieren\");\n    let nixconfig = PathBuf::from(\u0026home).join(\"xanterella\").join(\"config\");\n    let nixcolmena = PathBuf::from(\u0026nixconfig).join(\"colmena-hosts.nix\");\n    let nixhosts = PathBuf::from(\u0026nixconfig).join(\"hosts\");\n    let nixmodules = PathBuf::from(\u0026nixconfig).join(\"modules\");\n    let nixprofiles = PathBuf::from(\u0026nixconfig).join(\"profiles\");\n    let config = PathBuf::from(\u0026home).join(\".config\").join(\"xanterella\");\n    let templates = PathBuf::from(\u0026config).join(\"templates\");\n    let result: PathBuf = match option {\n        Paths::Home =\u003e home.into(),\n        Paths::Nixconf =\u003e nixconfig,\n        Paths::Colmena =\u003e nixcolmena,\n        Paths::Hosts =\u003e nixhosts,\n        Paths::Modules =\u003e nixmodules,\n        Paths::Profiles =\u003e nixprofiles,\n        Paths::Config =\u003e config,\n        Paths::Templates =\u003e templates,\n    };\n    result.to_str().expect(\"[ FAILED ] - Gen Path ist fehlgeschlagen\").to_string()\n}\n\npub fn get_hardware(ip: \u0026str) -\u003e String {\n    info!(\"[ RUN ] - Generiere Hardware\");\n\n    let ssh = Command::new(\"ssh\")\n        .args(get_sshstring(ip, User::Root))\n        .arg(\"nixos-generate-config --no-filesystems --show-hardware-config\")\n        .output()\n        .unwrap_or_else(|err| {\n            error!(\"[ FAILED ] - Konnte SSH nicht starten: {}\", err);\n            process::exit(1);\n        });\n    if !ssh.status.success() {\n        error!(\"[ FAILED ] - Fehler beim erstellen der Hardware Config: {}\", String::from_utf8_lossy(\u0026ssh.stderr));\n        process::exit(1);\n    }\n\n    let hardware_config = String::from_utf8_lossy(\u0026ssh.stdout).to_string();\n    info!(\"[ OK ] - Hardware erfolgreich geneiert\");\n    debug!(\"{}\", hardware_config);\n    hardware_config\n}\n\npub fn get_drives(ip: \u0026str) -\u003e Drives {\n    info!(\"[ RUN ] - Parse Drives\");\n\n    let parsed_drives;\n    if ip != \"127.0.0.1\" {\n        let lsblk =\n            Command::new(\"ssh\").args(get_sshstring(ip, User::Root)).arg(\"lsblk\").arg(\"--json\").output().unwrap_or_else(\n                |err| {\n                    error!(\"[ FAILED ] - Konnte lsblk nicht starten: {}\", err);\n                    process::exit(1);\n                },\n            );\n        if !lsblk.status.success() {\n            error!(\n                \"[ FAILED ] - Fehler beim Auslesen der als root Partitionen: {}\",\n                String::from_utf8_lossy(\u0026lsblk.stderr)\n            );\n\n            let lsblk1 = Command::new(\"ssh\")\n                .args(get_sshstring(ip, User::Cato))\n                .arg(\"lsblk\")\n                .arg(\"--json\")\n                .output()\n                .unwrap_or_else(|err| {\n                    error!(\"[ FAILED ] - Konnte lsblk nicht starten: {}\", err);\n                    process::exit(1);\n                });\n            if !lsblk1.status.success() {\n                error!(\n                    \"[ FAILED ] - Fehler beim Auslesen der als cato Partitionen: {}\",\n                    String::from_utf8_lossy(\u0026lsblk.stderr)\n                );\n                process::exit(1);\n            } else {\n                info!(\"[ OK ] - Drives mit Cato geparsen\");\n                parsed_drives = serde_json::from_slice::\u003cDrives\u003e(\u0026lsblk1.stdout).unwrap_or_else(|err| {\n                    error!(\"[ FAILED ] - Konnte lsblk nicht parsen: {}\", err);\n                    process::exit(1);\n                });\n            }\n        } else {\n            info!(\"[ OK ] - Drives mit Root geparsen\");\n            parsed_drives = serde_json::from_slice::\u003cDrives\u003e(\u0026lsblk.stdout).unwrap_or_else(|err| {\n                error!(\"[ FAILED ] - Konnte lsblk nicht parsen: {}\", err);\n                process::exit(1);\n            });\n        }\n    } else {\n        let lsblk = Command::new(\"lsblk\").arg(\"--json\").output().unwrap_or_else(|err| {\n            error!(\"[ FAILED ] - Konnte lsblk nicht starten: {}\", err);\n            process::exit(1);\n        });\n        if !lsblk.status.success() {\n            error!(\"[ FAILED ] - Fehler beim Auslesen der Partitionen: {}\", String::from_utf8_lossy(\u0026lsblk.stderr));\n        }\n        info!(\"[ OK ] - Drives lokal geparsen\");\n\n        parsed_drives = serde_json::from_slice::\u003cDrives\u003e(\u0026lsblk.stdout).unwrap_or_else(|err| {\n            error!(\"[ FAILED ] - Konnte lsblk nicht parsen: {}\", err);\n            process::exit(1);\n        });\n    }\n    info!(\"[ OK ] - Drives erfasst\");\n    parsed_drives\n}\n\npub fn get_sort_drives(drives: Drives) -\u003e Drives {\n    let mut drives = drives;\n    drives.blockdevices.sort_by(|a, b| {\n        let size_a = get_drives_size(\u0026a.size);\n        let size_b = get_drives_size(\u0026b.size);\n        size_b.cmp(\u0026size_a)\n    });\n    drives\n}\n\npub fn get_taildevices() -\u003e Taildevices {\n    //info!(\"[ RUN ] - Parse Tailscale Geräte\");\n\n    let tail_status = Command::new(\"tailscale\").arg(\"status\").arg(\"--json\").output().unwrap_or_else(|err| {\n        error!(\"[ FAILED ] - Konnte 'tailscale status --json' nicht ausführen: {}\", err);\n        process::exit(1);\n    });\n    if !tail_status.status.success() {\n        error!(\n            \"[ FAILED ] - Tailscale Status ist Fehlgeschlagen, bist du eingelogt, wurde das JSON nicht richtig geparst: {}\",\n            String::from_utf8_lossy(\u0026tail_status.stderr)\n        );\n        process::exit(1);\n    }\n\n    //info!(\"[ OK ] - Parse Tailscale Geräte erfolgreich\");\n    serde_json::from_slice::\u003cTaildevices\u003e(\u0026tail_status.stdout).unwrap_or_else(|err| {\n        error!(\"[ FAILED ] - Konnte den Output von Tailscale nicht parsen: {}\", err);\n        process::exit(1);\n    })\n}\n\npub fn get_taildevices_specific(devices: Taildevices, name: \u0026str, active_installs: \u0026HashSet\u003cString\u003e) -\u003e Vec\u003cString\u003e {\n    let mut ips: Vec\u003cString\u003e = vec![];\n    for (_nodekey, device) in devices.devices {\n        if device.name == name \u0026\u0026 device.os == \"linux\" {\n            let ip = device.ip[0].clone();\n            if !active_installs.contains(\u0026ip) {\n                let _ = \u0026mut ips.push(ip.to_owned());\n            }\n        }\n    }\n    ips\n}\n\npub fn get_sshstring(ip: \u0026str, user: User) -\u003e Vec\u003cString\u003e {\n    let target = match user {\n        User::Root =\u003e format!(\"root@{}\", ip),\n        User::Cato =\u003e format!(\"cato@{}\", ip),\n    };\n    vec![\n        \"-o\".to_string(),\n        \"StrictHostKeyChecking=no\".to_string(),\n        \"-o\".to_string(),\n        \"UserKnownHostsFile=/dev/null\".to_string(),\n        target,\n    ]\n}\n\npub fn get_drives_name(primdrive: \u0026str, number: i8) -\u003e String {\n    let drive = format!(\"/dev/{}\", primdrive);\n    let p_suffix = if primdrive.contains(\"nvme\") || primdrive.contains(\"mmclblk\") { \"p\" } else { \"\" };\n    let partition = format!(\"{}{}{}\", drive, p_suffix, number);\n    partition\n}\n\npub fn get_iso(mode: FlashMode, ip: \u0026str) -\u003e String {\n    match mode {\n        FlashMode::Local =\u003e {\n            info!(\"[ RUN ] - Finde ISO lokal\");\n\n            let iso_path = std::path::PathBuf::from(get_path(Paths::Nixconf)).join(\"result\").join(\"iso\");\n            let entries = fs::read_dir(\u0026iso_path).unwrap_or_else(|err| {\n                error!(\"[ FAILED ] - Konnte den Result Ordner nicht auslesen: {}\", err);\n                process::exit(1);\n            });\n\n            for i in entries {\n                if let Ok(file) = i {\n                    let path: std::path::PathBuf = file.path();\n                    if path.is_file() \u0026\u0026 path.extension().unwrap_or_default() == \"iso\" {\n                        let target_path = path.to_string_lossy().into_owned();\n                        info!(\"[ OK ] - ISO gefunden\");\n                        return target_path;\n                    }\n                }\n            }\n            error!(\"[ FAILED ] - Keine .iso Datei im result Ordner gefunden\");\n            process::exit(1);\n        }\n        FlashMode::Remote =\u003e {\n            info!(\"[ RUN ] - Finde ISO remote\");\n\n            let iso_path = format!(\"realpath {}/result/iso/*.iso\", get_path(Paths::Nixconf));\n            let realpath =\n                Command::new(\"ssh\")\n                    .args(get_sshstring(ip, User::Root))\n                    .arg(iso_path)\n                    .output()\n                    .unwrap_or_else(|err| {\n                        error!(\"[ FAILED ] - Konnte den Result Ordner nicht auslesen: {}\", err);\n                        process::exit(1);\n                    });\n            if !realpath.status.success() {\n                error!(\"[ FAILED ] - Kontte den Result Ordner nicht auslesen: {}\", String::from_utf8_lossy(\u0026realpath.stderr));\n                process::exit(1);\n            }\n            let output = String::from_utf8_lossy(\u0026realpath.stdout).trim().to_string();\n            debug!(\"ISO Remote Path: {}\", output);\n            output\n        }\n    }\n}\n\npub fn get_drives_size(size_str: \u0026str) -\u003e u64 {\n    let size_str = size_str.trim().to_uppercase();\n    let mut multiplier: f64 = 1.0;\n    let mut num_str = size_str.as_str();\n\n    if size_str.ends_with('T') {\n        multiplier = 1024.0 * 1024.0 * 1024.0 * 1024.0;\n        num_str = \u0026size_str[..size_str.len() - 1];\n    } else if size_str.ends_with('G') {\n        multiplier = 1024.0 * 1024.0 * 1024.0;\n        num_str = \u0026size_str[..size_str.len() - 1];\n    } else if size_str.ends_with('M') {\n        multiplier = 1024.0 * 1024.0;\n        num_str = \u0026size_str[..size_str.len() - 1];\n    }\n\n    let val: f64 = num_str.parse().unwrap_or(0.0);\n\n    (val * multiplier) as u64\n}\n\n#[cfg(test)]\n#[path = \"get_test.rs\"]\nmod tests;\n","traces":[{"line":59,"address":[1800354,1797088,1800194],"length":1,"stats":{"Line":1}},{"line":60,"address":[1590536],"length":1,"stats":{"Line":1}},{"line":61,"address":[1797297,1797365],"length":1,"stats":{"Line":2}},{"line":62,"address":[1591136],"length":1,"stats":{"Line":1}},{"line":63,"address":[2145223],"length":1,"stats":{"Line":1}},{"line":64,"address":[2145438],"length":1,"stats":{"Line":1}}
