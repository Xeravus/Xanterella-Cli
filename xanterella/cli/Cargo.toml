[package]
name = "xanterella-cli"
version = "0.1.1"
edition = "2024"

[dependencies]
xanterella-core = { path = "../core" }
tokio = { workspace = true, features = ["full"] }

prolyxena = { git = "https://github.com/Xeravus/Xanterella-Cli", branch = "final/staging" }

clap = { version = "4.6.1", features = ["derive"]}
cliclack = "0.5.6"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
