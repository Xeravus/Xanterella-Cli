name: Xanterella-Cli CI Cleanup

on:
  pull_request:
    branches: [ "final/cleanup" ]

jobs:
  check-guard:
    name: Check Guard
    uses: ./.github/workflows/branchguard.yml

  flake:
    name: Flake Check (Cleanup)
    runs-on: [self-hosted, xanterella, fast]
    if: needs.check-guard.outputs.proceed == 'true'
    needs:
      - check-guard

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Nix Flake Check 
        run: nix flake check 

  xanterella-start:
    name: Xanterella Start (Cleanup)
    runs-on: [self-hosted, xanterella]
    needs: 
      - flake

    steps:
      - name: Start 
        run: echo "Starte"

  xanterella-start-test:
    name: Xanterella Start Tests (Cleanup)
    runs-on: [self-hosted, xanterella]
    needs: 
      - xanterella-start
      - xanterella-machete
      - xanterella-audit
      - xanterella-check
      - xanterella-clippy
      - xanterella-format

    steps:
      - name: Start 
        run: echo "Starte"

  xanterella-machete:
    name: Xanterella Machete (Cleanup)
    needs: 
      - xanterella-start
    runs-on: [self-hosted, xanterella]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cargo Machete
        run: nix develop .#xanterella --command bash -c "cd xanterella && cargo machete"

  xanterella-audit:
    name: Xanterella Audit (Cleanup)
    needs:
      - xanterella-start
    runs-on: [self-hosted, xanterella]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cargo Audit
        run: nix develop .#xanterella --command bash -c "cd xanterella && cargo audit"

  xanterella-format:
    name: Xanterella Format (Cleanup)
    needs:
      - xanterella-start
    runs-on: [self-hosted, xanterella]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cargo Format
        run: nix develop .#xanterella --command bash -c "cd xanterella && cargo fmt --check"

  xanterella-check:
    name: Xanterella Check (Cleanup)
    needs:
      - xanterella-start
    runs-on: [self-hosted, xanterella]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cargo Check
        run: nix develop .#xanterella --command bash -c "cd xanterella && cargo check --release"

  xanterella-clippy:
    name: Xanterella Clippy (Cleanup)
    needs:
      - xanterella-start
    runs-on: [self-hosted, xanterella]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cargo Clippy
        run: nix develop .#xanterella --command bash -c "cd xanterella && cargo clippy -- -D warnings"

  xanterella-test:
    name: Xanterella Test (Cleanup)
    needs:
      - xanterella-start-test
    runs-on: [self-hosted, xanterella]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cargo Test
        run: nix develop .#xanterella --command bash -c "cd xanterella && cargo test -- --include-ignored"

  xanterella-tarpaulin:
    name: Xanterella Tarpaulin (Cleanup)
    needs:
      - xanterella-start-test
    runs-on: [self-hosted, xanterella]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cargo Tarpaulin
        run: nix develop .#xanterella --command bash -c "cd xanterella && cargo tarpaulin --fail-under 60"

  xanterella-doc:
    name: Xanterella Doc Check (Cleanup)
    needs:
      - xanterella-start-test
    runs-on: [self-hosted, xanterella]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cargo Doc (Documentation Check)
        run: nix develop .#xanterella --command bash -c "cd xanterella && RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --document-private-items"

  xanterella-build:
    name: Xanterella Build (Cleanup)
    needs:
      - xanterella-doc
      - xanterella-tarpaulin
      - xanterella-test
    runs-on: [self-hosted, xanterella]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cargo Build
        run: nix build .#xanterella

  prolyxena-start:
    name: Prolyxena Start (Cleanup)
    runs-on: [self-hosted, xanterella]
    needs: 
      - flake

    steps:
      - name: Start 
        run: echo "Starte"

  prolyxena-start-test:
    name: Prolyxena Start Tests (Cleanup)
    runs-on: [self-hosted, xanterella]
    needs: 
      - prolyxena-start
      - prolyxena-machete
      - prolyxena-audit
      - prolyxena-check
      - prolyxena-clippy
      - prolyxena-format

    steps:
      - name: Start 
        run: echo "Starte"

  prolyxena-machete:
    name: Prolyxena Machete (Cleanup)
    needs: 
      - prolyxena-start
    runs-on: [self-hosted, xanterella]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cargo Machete
        run: nix develop .#prolyxena --command bash -c "cd prolyxena && cargo machete"

  prolyxena-audit:
    name: Prolyxena Audit (Cleanup)
    needs:
      - prolyxena-start
    runs-on: [self-hosted, xanterella]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cargo Audit
        run: nix develop .#prolyxena --command bash -c "cd prolyxena && cargo audit"

  prolyxena-format:
    name: Prolyxena Format (Cleanup)
    needs:
      - prolyxena-start
    runs-on: [self-hosted, xanterella]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cargo Format
        run: nix develop .#prolyxena --command bash -c "cd prolyxena && cargo fmt --check"

  prolyxena-check:
    name: Prolyxena Check (Cleanup)
    needs:
      - prolyxena-start
    runs-on: [self-hosted, xanterella]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cargo Check
        run: nix develop .#prolyxena --command bash -c "cd prolyxena && cargo check --release"

  prolyxena-clippy:
    name: Prolyxena Clippy (Cleanup)
    needs:
      - prolyxena-start
    runs-on: [self-hosted, xanterella]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cargo Clippy
        run: nix develop .#prolyxena --command bash -c "cd prolyxena && cargo clippy -- -D warnings"

  prolyxena-test:
    name: Prolyxena Test (Cleanup)
    needs:
      - prolyxena-start-test
    runs-on: [self-hosted, xanterella]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cargo Test
