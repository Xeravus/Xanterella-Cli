    runs-on: [self-hosted, xanterella]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cargo Tarpaulin
        run: nix develop .#prolyxena --command bash -c "cd prolyxena && cargo tarpaulin --fail-under 60"

  prolyxena-doc:
    name: Prolyxena Doc Check (Cleanup)
    needs:
      - prolyxena-start-test
    runs-on: [self-hosted, xanterella]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cargo Doc (Documentation Check)
        run: nix develop .#prolyxena --command bash -c "cd prolyxena && RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --document-private-items"

  prolyxena-build:
    name: Prolyxena Build (Cleanup)
    needs:
      - prolyxena-doc
      - prolyxena-tarpaulin
      - prolyxena-test
    runs-on: [self-hosted, xanterella]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cargo Build
        run: nix build .#prolyxena
